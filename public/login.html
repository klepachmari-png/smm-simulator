<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вхід у симулятор — МК SMM 1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap">
  <style>
    :root{color-scheme:dark;--bg:#06120D;--card:rgba(255,255,255,.055);--stroke:rgba(160,255,205,.16);--text:#EAF7F0;--muted:#9DB8AA;--em:#17C979;--mint:#9CF5C8;--lime:#D8FF72}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(60% 50% at 90% 0,rgba(23,201,121,.25),transparent 70%),var(--bg);color:var(--text);font:16px/1.55 "Onest",system-ui,sans-serif}
    main{width:min(100%,520px);display:grid;gap:18px;padding:clamp(24px,6vw,42px);border:1px solid var(--stroke);border-radius:28px;background:var(--card);box-shadow:0 30px 90px rgba(0,0,0,.35)}
    .brand{display:flex;align-items:center;gap:12px;font-family:"Geologica",sans-serif;font-weight:800}.brand b{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(100deg,var(--mint),var(--em));color:#04120B}
    h1{margin:0;font:800 clamp(1.8rem,7vw,2.7rem)/1.08 "Geologica",sans-serif;letter-spacing:-.03em}p{margin:0}.muted{color:var(--muted)}
    form{display:grid;gap:12px}label{display:grid;gap:7px;font-weight:600}input{width:100%;border:1px solid var(--stroke);border-radius:14px;background:rgba(0,0,0,.25);color:var(--text);font:inherit;padding:14px 15px}input:focus{outline:3px solid rgba(23,201,121,.22);border-color:var(--em)}
    button{border:0;border-radius:999px;background:var(--em);color:#03140C;font:700 1rem "Onest",sans-serif;padding:14px 20px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.link{border:1px solid var(--stroke);background:transparent;color:var(--text)}
    .note{padding:14px 16px;border-radius:16px;background:rgba(216,255,114,.08);border:1px solid rgba(216,255,114,.2);font-size:.9rem}.error{color:#ffad92}.success{color:var(--mint)}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="brand"><b>МК</b><span>МК SMM 1.0</span></div>
    <div>
      <h1>Твій особистий вхід</h1>
      <p class="muted">Введи email — ми надішлемо одноразовий код. Пароль створювати не потрібно.</p>
    </div>
    <form id="emailForm">
      <label>Email<input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="name@example.com"></label>
      <button id="send" type="submit">Отримати код</button>
    </form>
    <form id="codeForm" hidden>
      <label>Код із листа<input id="code" type="text" autocomplete="one-time-code" inputmode="numeric" maxlength="8" required placeholder="Введи код"></label>
      <button id="verify" type="submit">Увійти й продовжити</button>
      <button class="link" id="change" type="button">Змінити email</button>
    </form>
    <p id="status" class="muted" role="status"></p>
    <p class="note">Прогрес зберігатиметься у твоєму акаунті й відкриється на телефоні або комп’ютері після входу з тим самим email.</p>
  </main>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
  <script>
  (function(){
    var cfg=window.MK_CONFIG||{}, status=document.getElementById("status");
    var ready=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&cfg.SUPABASE_URL.indexOf("__")!==0&&cfg.SUPABASE_ANON_KEY.indexOf("__")!==0;
    if(!ready){ status.className="error"; status.textContent="Вхід ще налаштовується. Спробуй трохи пізніше."; document.getElementById("send").disabled=true; return; }
    var sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}), currentEmail="";
    var params=new URLSearchParams(location.search), next=/^[A-Za-z0-9._-]+$/.test(params.get("next")||"")?params.get("next"):"simulator.html", legacy=params.get("u")||"";
    function destination(){ var url=next; if(legacy) url+=(url.indexOf("?")>=0?"&":"?")+"u="+encodeURIComponent(legacy); return url; }
    sb.auth.getSession().then(function(r){ if(r.data&&r.data.session){ localStorage.setItem("mk_auth_uid",r.data.session.user.id); localStorage.setItem("mk_auth_email",r.data.session.user.email||""); location.replace(destination()); }});
    document.getElementById("emailForm").onsubmit=async function(e){ e.preventDefault(); currentEmail=document.getElementById("email").value.trim().toLowerCase(); var b=document.getElementById("send"); b.disabled=true; status.className="muted"; status.textContent="Надсилаю код…";
      var r=await sb.auth.signInWithOtp({email:currentEmail,options:{shouldCreateUser:true}}); b.disabled=false;
      if(r.error){ status.className="error"; status.textContent="Не вдалося надіслати код. Перевір email і спробуй ще раз."; return; }
      document.getElementById("emailForm").hidden=true; document.getElementById("codeForm").hidden=false; status.className="success"; status.textContent="Код надіслано на "+currentEmail; document.getElementById("code").focus();
    };
    document.getElementById("codeForm").onsubmit=async function(e){ e.preventDefault(); var b=document.getElementById("verify"), token=document.getElementById("code").value.replace(/\s+/g,""); b.disabled=true; status.className="muted"; status.textContent="Перевіряю код…";
      var r=await sb.auth.verifyOtp({email:currentEmail,token:token,type:"email"}); b.disabled=false;
      if(r.error||!r.data||!r.data.user){ status.className="error"; status.textContent="Код неправильний або вже не діє. Спробуй ще раз."; return; }
      localStorage.setItem("mk_auth_uid",r.data.user.id); localStorage.setItem("mk_auth_email",r.data.user.email||currentEmail); status.className="success"; status.textContent="Готово. Відкриваю твій симулятор…"; location.replace(destination());
    };
    document.getElementById("change").onclick=function(){ document.getElementById("codeForm").hidden=true; document.getElementById("emailForm").hidden=false; status.textContent=""; document.getElementById("email").focus(); };
  })();
  </script>
</body>
</html>
