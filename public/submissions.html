<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Здачі учасників · МК SMM 1.0</title><style>:root{--bg:#f5f7f5;--card:#fff;--line:#dce5e0;--text:#0a1f17;--muted:#5c6c64;--em:#0f8a5f;--deep:#062a1f;--new:#fff4d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border-radius:12px;padding:11px 13px}input,select{border:1px solid var(--line);background:#fff}button,.btn{border:0;background:var(--deep);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:11px 13px;border-radius:12px}.btn.alt{background:#fff;color:var(--text);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);background:#fff}.table{overflow:auto}.muted{color:var(--muted)}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef5f1;font-size:12px}.badge.new{background:var(--new);color:#815000}.err{color:#b33}.ok{color:var(--em)}[hidden]{display:none!important}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Здачі учасників</h1><div class="muted">Кожен завершений крок окремо. Тут ти бачиш, кому вже дала фідбек.</div></div><a class="btn alt" href="admin.html">← Учасники</a></div><div class="card" id="login"><h2>Вхід адміністратора</h2><div class="row"><input id="email" type="email" placeholder="Email"><button id="send">Отримати код</button></div><div class="row" id="codeRow" hidden style="margin-top:10px"><input id="code" inputmode="numeric" placeholder="Код"><button id="verify">Увійти</button></div><p id="status" class="muted"></p></div><div id="app" hidden><div class="card"><div class="row"><input id="search" placeholder="Пошук по email / Telegram"><select id="filter"><option value="all">Усі</option><option value="new">Нові</option><option value="seen">Переглянуті</option><option value="replied">Фідбек надано</option></select><button id="refresh">Оновити</button></div></div><div class="card table"><table><thead><tr><th>Учасник</th><th>Крок</th><th>Здано</th><th>Статус</th><th>Telegram</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>(function(){var cfg=window.MK_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=function(i){return document.getElementById(i)},mail='',rows=[],profiles={};function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function fmt(x){try{return new Date(x).toLocaleString('uk-UA')}catch(e){return x||'—'}}function day(n){return Number(n)===0?'Старт':'День '+n}async function isAdmin(){var r=await sb.from('admin_users').select('user_id').maybeSingle();return !r.error&&!!r.data}async function boot(){var s=(await sb.auth.getSession()).data.session;if(!s||!(await isAdmin())){$('login').hidden=false;$('app').hidden=true;return}$('login').hidden=true;$('app').hidden=false;load()}async function load(){var rs=await Promise.all([sb.from('day_submissions').select('*').order('submitted_at',{ascending:false}),sb.from('participant_profiles').select('user_id,email,telegram_id')]);if(rs[0].error||rs[1].error){alert('Не вдалося завантажити здачі');return}rows=rs[0].data||[];profiles={};(rs[1].data||[]).forEach(function(p){profiles[p.user_id]=p});render()}function render(){var q=$('search').value.trim().toLowerCase(),f=$('filter').value;var a=rows.filter(function(r){var p=profiles[r.user_id]||{},hay=((p.email||'')+' '+(p.telegram_id||'')).toLowerCase();return(!q||hay.includes(q))&&(f==='all'||r.status===f)});$('tbody').innerHTML=a.map(function(r){var p=profiles[r.user_id]||{};return'<tr><td><b>'+esc(p.email||'—')+'</b></td><td>'+day(r.day_index)+'</td><td>'+fmt(r.submitted_at)+'</td><td><span class="badge '+(r.status==='new'?'new':'')+'">'+esc(r.status)+'</span></td><td>'+esc(p.telegram_id||'—')+'</td><td><a class="btn" href="submission.html?id='+encodeURIComponent(r.id)+'">Відкрити</a></td></tr>'}).join('')||'<tr><td colspan="6" class="muted">Немає здач</td></tr>'}$('send').onclick=async function(){mail=$('email').value.trim().toLowerCase();$('status').textContent='Надсилаю код…';var r=await sb.auth.signInWithOtp({email:mail,options:{shouldCreateUser:false}});if(r.error){$('status').className='err';$('status').textContent=r.error.message;return}$('codeRow').hidden=false;$('status').className='ok';$('status').textContent='Код надіслано'};$('verify').onclick=async function(){var r=await sb.auth.verifyOtp({email:mail,token:$('code').value.trim(),type:'email'});if(r.error){$('status').className='err';$('status').textContent='Неправильний або прострочений код';return}boot()};$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;boot()})();</script></body></html>
