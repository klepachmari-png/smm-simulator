<body>
<style>
:root{
  color-scheme:dark;
  --bg:#06120D;--bg-2:#0A1C15;--card:rgba(255,255,255,.045);--card-2:rgba(255,255,255,.08);
  --stroke:rgba(160,255,205,.14);--text:#EAF7F0;--muted:#9DB8AA;
  --em:#17C979;--em-2:#0E9A5C;--mint:#9CF5C8;--lime:#D8FF72;--teal:#3FE0D0;--copper:#FF8A5B;
  --grad:linear-gradient(100deg,#9CF5C8 0%,#17C979 45%,#3FE0D0 100%);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 60px;-webkit-font-smoothing:antialiased;overflow-x:clip;
  background-image:radial-gradient(60% 40% at 90% -5%,rgba(23,201,121,.28),transparent 70%),radial-gradient(50% 35% at -10% 20%,rgba(63,224,208,.12),transparent 70%);background-repeat:no-repeat}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.wrap{max-width:980px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(1.7rem,4.4vw,2.8rem);font-weight:900}
h2{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.small{font-size:.86rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--mint)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;background:rgba(6,18,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke)}
.top .wrap{display:flex;align-items:center;gap:14px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:.9rem;white-space:nowrap;background:none;border:0;padding:0}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--grad);color:#04120B;font-size:.7rem}
.prog{flex:1;max-width:320px;display:grid;gap:4px}
.prog .bar{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.prog span{font-size:.75rem;color:var(--muted);text-align:right}
@media (max-width:520px){.logo span{display:none}}

/* shared */
.card{border-radius:22px;padding:22px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--stroke)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:700;border:0;background:var(--em);color:#03140C;text-decoration:none;box-shadow:0 14px 30px -14px rgba(23,201,121,.8);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--stroke)}
.btn.lime{background:var(--lime);color:#0B1A06}
.btn.sm{padding:9px 14px;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);font-size:.78rem;font-weight:600;color:var(--mint)}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
section{padding-top:28px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.93rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],textarea{width:100%;font:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:14px;padding:12px 14px;resize:vertical}
textarea{min-height:84px}
input:focus,textarea:focus{border-color:var(--em);outline:none;box-shadow:0 0 0 3px rgba(23,201,121,.2)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--stroke);font-weight:500;font-size:.92rem;cursor:pointer}
.choice input{accent-color:var(--em)}
.choice label:has(input:checked){border-color:var(--em);background:rgba(23,201,121,.14)}
.count{font-size:.78rem;color:var(--muted);text-align:right}
.count.over{color:var(--copper)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}}

/* welcome */
.hero{padding-top:36px;display:grid;gap:18px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:680px){.tracks{grid-template-columns:1fr}}
.track{text-align:left;display:grid;gap:10px;padding:22px;border-radius:22px;background:var(--card);border:1.5px solid var(--stroke);transition:border-color .2s,background .2s}
.track[aria-pressed="true"]{border-color:var(--em);background:rgba(23,201,121,.12)}
.track .tag{font-family:var(--display);font-weight:900;font-size:1.6rem}
.rubric{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:680px){.rubric{grid-template-columns:1fr 1fr}}
.rubric div{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);display:grid;gap:4px}
.rubric b{font-size:.9rem}
.rubric span{font-size:.8rem;color:var(--muted)}

/* dashboard */
.days{display:grid;gap:12px}
.day{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;text-align:left;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--stroke);width:100%}
.day .n{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1}
.day .t{display:grid;gap:3px}
.day .t b{font-size:1.02rem}
.day .st{font-size:.76rem;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}
.day.done{border-color:rgba(23,201,121,.45)}
.day.done .st{background:rgba(23,201,121,.18);color:var(--mint)}
.day.open{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset,0 20px 40px -24px rgba(216,255,114,.5)}
.day.open .st{background:var(--lime);color:#0B1A06}
.day.locked{opacity:.5;cursor:not-allowed}
.day.locked .st{background:var(--card-2);color:var(--muted)}

/* day view */
.dayhead{display:grid;gap:12px;padding-top:28px}
.letter{position:relative;border-radius:22px;padding:22px 22px 22px 76px;background:linear-gradient(120deg,rgba(216,255,114,.12),rgba(23,201,121,.06));border:1px solid rgba(216,255,114,.3)}
.letter .av{position:absolute;left:20px;top:20px;width:42px;height:42px;border-radius:50%;background:var(--lime);color:#0B1A06;display:grid;place-items:center;font-family:var(--display);font-weight:900}
.letter .from{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.letter q{font-size:1.1rem;quotes:"«" "»"}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:rgba(23,201,121,.18);color:var(--mint);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.brief{white-space:pre-wrap;font-size:.93rem;background:rgba(0,0,0,.25);border:1px dashed var(--stroke);border-radius:16px;padding:16px;max-height:340px;overflow:auto}
details.fold{border-radius:18px;background:var(--card);border:1px solid var(--stroke)}
details.fold summary{cursor:pointer;padding:16px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";color:var(--mint);font-size:1.2rem;line-height:1}
details.fold[open] summary::after{content:"–"}
details.fold > div{padding:0 18px 18px}
.prompt{position:relative;border-radius:18px;padding:18px;background:rgba(63,224,208,.07);border:1px solid rgba(63,224,208,.3);display:grid;gap:12px}
.prompt pre{margin:0;white-space:pre-wrap;font:inherit;font-size:.92rem;max-height:260px;overflow:auto}
.prompt .h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prompt .h b{color:var(--teal);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.tbl{overflow-x:auto;border-radius:16px;border:1px solid var(--stroke)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px}
.tbl th,.tbl td{border-bottom:1px solid var(--stroke);padding:8px;vertical-align:top;text-align:left;font-size:.85rem}
.tbl th{background:var(--card-2);font-weight:700}
.tbl td textarea,.tbl td input{min-height:0;padding:8px 10px;border-radius:10px;font-size:.85rem}
.tbl td textarea{min-height:60px}
.checklist{display:grid;gap:8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;cursor:pointer}
.checklist input{accent-color:var(--em);width:18px;height:18px;margin-top:2px;flex:none}
.submit{display:grid;gap:14px;border-radius:24px;padding:24px;background:linear-gradient(160deg,#0F3A28,#08170F) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:#0B1A06;font-weight:700;padding:12px 18px;border-radius:999px;z-index:50;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}

/* post preview (day 3) */
.post{width:min(100%,340px);border-radius:18px;overflow:hidden;background:#fff;color:#111;font-size:.86rem;justify-self:center}
.post .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post .ph i{width:30px;height:30px;border-radius:50%;background:var(--grad)}
.post .ph b{font-size:.82rem}
.post .img{aspect-ratio:4/5;background:linear-gradient(160deg,#0E9A5C,#063322);display:grid;place-items:center;padding:24px;text-align:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.15}
.post .cap{padding:10px 12px 14px;white-space:pre-wrap;line-height:1.4}
.post .cap b{margin-right:4px}

/* storyboard (day 4) */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:760px){.board{grid-template-columns:1fr 1fr}}
.frame{border-radius:16px;background:var(--card);border:1px solid var(--stroke);padding:10px;display:grid;gap:8px;align-content:start}
.frame .scr{aspect-ratio:9/16;border-radius:10px;background:linear-gradient(180deg,#0F3A28,#06120D);display:grid;align-content:space-between;padding:10px;font-size:.72rem}
.frame .scr b{font-family:var(--display);font-size:.9rem;color:var(--lime)}
.frame .scr span{background:rgba(0,0,0,.45);padding:4px 6px;border-radius:6px;text-align:center;font-weight:600}
.frame textarea{min-height:60px;font-size:.8rem;padding:8px}
.frame input{font-size:.8rem;padding:8px}

/* self rubric */
.score{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--stroke)}
.score .dots{display:flex;gap:6px}
.score .dots button{width:36px;height:36px;border-radius:10px;border:1px solid var(--stroke);background:var(--card);font-weight:800}
.score .dots button[aria-pressed="true"]{background:var(--em);color:#03140C;border-color:var(--em)}
.total{font-family:var(--display);font-weight:900;font-size:2rem}
</style>
<style>
/* нові блоки навчального наповнення */
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.sec-title i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(23,201,121,.16);color:var(--mint);flex:none}
.why{border-radius:22px;padding:22px;background:linear-gradient(120deg,rgba(63,224,208,.1),rgba(23,201,121,.05));border:1px solid rgba(63,224,208,.28);display:grid;gap:12px}
.why p{max-width:72ch}
.brand-ex{border-left:3px solid var(--lime);padding:10px 14px;border-radius:0 12px 12px 0;background:rgba(216,255,114,.06);font-size:.94rem}
.brand-ex b{color:var(--lime)}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.term{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--stroke);display:grid;gap:10px;align-content:start}
.term p{margin:0;font-size:.9rem;line-height:1.55}
.term .td{color:var(--text)}
.term .tp{color:var(--muted)}
.term .tx{padding:10px 12px;border-radius:12px;background:rgba(23,201,121,.07);border-left:3px solid var(--em);color:var(--text);font-size:.86rem}
.term em{display:block;font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mint);margin-bottom:3px}
.term b{color:var(--mint);font-size:.95rem}
.term span{font-size:.86rem;color:var(--muted)}
.need{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.need .it{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--stroke)}
.need .it .ic{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#04120B;display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none}
.need .it b{display:block;font-size:.93rem}
.need .it span{font-size:.82rem;color:var(--muted)}
.guide{display:grid;gap:12px;counter-reset:g}
.gstep{counter-increment:g;border-radius:20px;background:var(--card);border:1px solid var(--stroke);padding:18px 18px 18px 70px;position:relative}
.gstep::before{content:counter(g);position:absolute;left:18px;top:16px;width:36px;height:36px;border-radius:12px;background:var(--em);color:#03140C;display:grid;place-items:center;font-family:var(--display);font-weight:900}
.gstep h3{font-family:var(--body);font-size:1.04rem;margin-bottom:8px}
.gstep ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.94rem}
.gstep li::marker{color:var(--em)}
.gstep .tip{margin-top:10px;font-size:.86rem;color:var(--lime)}
.gstep .path{display:inline;font-weight:700;color:var(--mint)}
.gstep label.done{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.86rem;color:var(--muted);cursor:pointer}
.gstep label.done input{accent-color:var(--em);width:18px;height:18px}
.gstep.ok{border-color:rgba(23,201,121,.5);background:rgba(23,201,121,.07)}
.example{border-radius:22px;padding:22px;background:rgba(255,138,91,.06);border:1px solid rgba(255,138,91,.3);display:grid;gap:10px}
.example h3{color:var(--copper)}
.example pre{margin:0;white-space:pre-wrap;font:inherit;font-size:.92rem}
.mistakes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.mistakes li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:.94rem}
.mistakes li::before{content:"✕";width:24px;height:24px;border-radius:8px;background:rgba(255,138,91,.15);color:var(--copper);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.file{border-radius:16px;background:var(--card);border:1px solid var(--stroke);overflow:hidden;display:grid}
.file img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#F6EFE6}
.file .fi{padding:10px 12px;display:grid;gap:8px}
.file .fi b{font-size:.84rem}
.file .xl{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(140deg,#0F3A28,#06120D);font-family:var(--display);font-weight:900;font-size:1.6rem;color:var(--mint)}
.media{border-radius:20px;padding:18px;background:rgba(216,255,114,.06);border:1px dashed rgba(216,255,114,.4);display:grid;gap:10px}
.media code{font-size:.85rem;color:var(--lime)}
.time{display:inline-flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
/* профіль Instagram (день 3) */
.ig{overflow:hidden;width:min(100%,380px);border-radius:22px;background:#fff;color:#111;padding:18px;display:grid;gap:12px;font-size:.88rem;justify-self:center}
.ig .top1{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.ig .row1{display:flex;align-items:center;gap:18px}
.ig .av{width:78px;height:78px;border-radius:50%;background:#D2693C;overflow:hidden;flex:none;border:2px solid #eee}
.ig .av img{width:100%;height:100%;object-fit:cover;display:block}
.ig .nums{display:flex;gap:16px;text-align:center;font-size:.8rem}
.ig .nums b{display:block;font-size:.98rem}
.ig .nm{font-weight:700}
.ig .cat{color:#737373;font-size:.82rem}
.ig .bio{white-space:pre-wrap;line-height:1.35}
.ig .lnk{color:#00376b;font-weight:600}
.ig .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ig .btns span{background:#efefef;border-radius:8px;padding:7px;text-align:center;font-weight:600;font-size:.8rem}
.ig .hl{display:flex;gap:12px;overflow-x:auto}
.ig .hl div{display:grid;justify-items:center;gap:4px;font-size:.72rem;flex:none}
.ig .hl i{width:56px;height:56px;border-radius:50%;border:1px solid #ddd;overflow:hidden;display:block}
.ig .hl i img{width:100%;height:100%;object-fit:cover}
.ig .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-inline:-18px;margin-bottom:-18px}
.ig .grid i{aspect-ratio:4/5;background:#e9e2d8}
.cp{overflow-x:auto;border-radius:16px;border:1px solid var(--stroke)}
.cp table{border-collapse:collapse;width:100%;min-width:760px}
.cp th,.cp td{padding:6px;border-bottom:1px solid var(--stroke);text-align:left;font-size:.82rem;vertical-align:top}
.cp th{background:var(--card-2)}
.cp select,.cp input{width:100%;font:inherit;font-size:.82rem;color:var(--text);background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:10px;padding:8px}
.warn{border-radius:16px;padding:14px 16px;background:rgba(255,138,91,.08);border:1px solid rgba(255,138,91,.3);font-size:.9rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:64px;z-index:5;padding:8px 0;background:var(--bg)}
.tabs a{text-decoration:none;font-size:.8rem;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);color:var(--muted)}
.tabs a:hover{color:var(--mint);border-color:var(--em)}
</style>

<style>
/* ===== Сучасний стиль (світла база + темні акценти) ===== */
:root{
  color-scheme:light;
  --bg:#F5F7F5;--bg-2:#E6EFEA;--card:#FFFFFF;--card-2:#EEF3F0;
  --stroke:#DCE5E0;--text:#0A1F17;--muted:#55665E;--ink:#062A1F;
  --em:#0F8A5F;--em-2:#0B6B49;--mint:#0B6B49;--lime:#A8E0C5;--teal:#0B6B49;--copper:#C4683D;
  --grad:none;
  --display:"Geologica","Onest",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
}
body{background:var(--bg);background-image:none}
h1,h2,h3{letter-spacing:-.03em}
h1{font-weight:800}
h2{font-weight:700}
.gt{background:linear-gradient(transparent 60%,var(--lime) 60%,var(--lime) 94%,transparent 94%);-webkit-background-clip:border-box;background-clip:border-box;color:inherit}
a{color:var(--em-2)}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.top{background:rgba(245,247,245,.88)}
.logo b{background:var(--ink);color:var(--lime)}
.prog .bar{background:var(--bg-2)}
.prog .bar i{background:var(--em)}
.card{background:var(--card)}
.btn{background:var(--ink);color:#fff;box-shadow:none;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--text)}
.btn.lime{background:var(--lime);color:var(--ink)}
.pill{background:var(--card);color:var(--text)}
input[type=text],input[type=url],textarea{background:#fff}
input:focus,textarea:focus{box-shadow:0 0 0 3px rgba(15,138,95,.18)}
.choice label{background:#fff}
.choice label:has(input:checked){border-color:var(--em);background:rgba(15,138,95,.1)}
.track{background:#fff}
.track[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#EEF5F0}
.track[aria-pressed="true"] .muted{color:#A1B3A9}
.track .tag{color:var(--em)}
.track[aria-pressed="true"] .tag{color:var(--lime)}
.day{background:#fff}
.day .n{color:var(--em-2)}
.day.done{border-color:rgba(15,138,95,.5)}
.day.done .st{background:rgba(15,138,95,.15);color:var(--em-2)}
.day.open{border-color:var(--ink);background:var(--ink);color:#EEF5F0;box-shadow:0 24px 40px -26px rgba(12,26,20,.6)}
.day.open .n{color:var(--lime)}
.day.open .muted,.day.open .small{color:#A1B3A9}
.day.open .st{background:var(--lime);color:var(--ink)}
.letter{background:#fff;border:1px solid var(--stroke);border-left:4px solid var(--lime)}
.letter .av{background:var(--ink);color:var(--lime)}
.steps li::before{background:var(--ink);color:var(--lime)}
.brief{background:#fff}
details.fold summary::after{color:var(--em-2)}
.prompt{background:var(--ink);border-color:var(--ink);color:#EEF5F0}
.prompt .h b{color:var(--lime)}
.prompt .btn{background:var(--lime);color:var(--ink)}
.prompt .muted,.prompt .small{color:#A1B3A9}
.submit{background:var(--ink);border:0;color:#EEF5F0}
.submit .small,.submit .muted{color:#A1B3A9}
.submit a:not(.btn){color:var(--lime)}
.submit .btn{background:var(--lime);color:var(--ink)}
.submit .btn.ghost{background:transparent;color:#EEF5F0;box-shadow:inset 0 0 0 1.5px rgba(238,245,240,.5)}
.toast{background:var(--ink);color:var(--lime)}
.day .n,.track .tag,.total,.medal big{background:none!important}
.day.open .n{color:var(--lime)!important}
.post .ph i{background:var(--em)}
.post .img{background:var(--em)}
.frame .scr{background:var(--ink);color:#EEF5F0}
.frame .scr b{color:var(--lime)}
.score .dots button{background:#fff}
.score .dots button[aria-pressed="true"]{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.sec-title i{background:var(--ink);color:var(--lime)}
.why{background:#fff;border-color:var(--stroke)}
.brand-ex{border-left-color:var(--em);background:rgba(15,138,95,.06)}
.brand-ex b{color:var(--em-2)}
.term .tx{background:rgba(168,224,197,.25);border-left-color:var(--em)}
.term em{color:var(--em-2)}
.need .it .ic{background:var(--ink);color:var(--lime)}
.gstep::before{background:var(--ink);color:var(--lime)}
.gstep .tip{color:#B4451C}
.gstep .path{color:var(--em-2)}
.gstep.ok{background:rgba(15,138,95,.07);border-color:rgba(15,138,95,.5)}
.example{background:#fff}
.file .xl{background:var(--ink);color:var(--lime)}
.media{background:rgba(168,224,197,.18);border-color:rgba(12,26,20,.25)}
.media code{color:var(--em-2)}
.cp select,.cp input{background:#fff}
.tabs a{background:#fff}
.tabs a:hover{color:var(--text);border-color:var(--ink)}
</style>

 {n:"01", title:"Бриф і аналіз ніші", sub:"Хто клієнт, що продаємо, де ми на ринку", time:"≈ 2 години",

  letterB:{from:"Ти · твоя справа", text:"Сьогодні ти і клієнт, і спеціаліст. Опиши свою справу за брифом і подивись на свою нішу очима маркетолога."},
  why:"Бриф — це завдання від клієнта: хто він, що продає, для кого і чого хоче. Аналіз ніші — погляд ширше: хто купує такі продукти, що їм болить, про що вони пишуть у відгуках, коли попит більший. Без цих двох кроків контент робиться навмання: гарно, але нікому.",
  example:"<b>Приклад великого бренду:</b> Glossier почався з блогу Into The Gloss, де авторка роками розмовляла з читачками про догляд. Коли бренд запустив перші продукти, він уже знав мову і болі своєї аудиторії.",
  terms:[["Бриф", "Документ, у якому клієнт описує свій бізнес і завдання: що продає, кому, які має цілі, бюджет, обмеження і побажання до стилю.", "Бриф — фундамент усієї роботи. Сильний спеціаліст не лише читає його, а шукає прогалини і ставить уточнювальні питання до старту, щоб потім не переробляти.", "У брифі написано «хочемо більше гостей». Спеціаліст уточнює: скільки гостей зараз, у який час їх бракує, за який термін потрібен результат."], ["Ніша", "Частина ринку, у якій працює бізнес: конкретний продукт для конкретної аудиторії на певній території.", "Що точніша ніша, то легше говорити з аудиторією її мовою і відрізнятися від конкурентів. «Кав'ярня» — це ринок, «dog-friendly кав'ярня в спальному районі» — уже ніша.", "Не «манікюр», а «манікюр з покриттям, що тримається 3–4 тижні, для зайнятих жінок у центрі Кракова»."], ["Цільова аудиторія (ЦА)", "Люди, які з найбільшою ймовірністю куплять продукт: їхній спосіб життя, потреби, звички і місця, де вони шукають інформацію.", "Від ЦА залежить усе: теми, тон, візуал, формати, налаштування реклами. Типова помилка новачків — описувати ЦА формально («жінки 25–45») замість живих ситуацій і мотивів.", "«Люди, які зранку йдуть на роботу повз кав'ярню, мають 3 хвилини і хочуть якісну каву з собою без черги»."], ["Сегмент", "Частина цільової аудиторії зі спільною ситуацією, потребами і поведінкою.", "Різні сегменти купують той самий продукт з різних причин, тому для кожного потрібні свої теми, аргументи і заклики. Зазвичай виділяють 2–4 ключові сегменти.", "Власникам собак говоримо: «з собаками можна, є миска з водою». Фрілансерам — «тиха зала і розетка біля кожного столика»."], ["Біль", "Проблема, страх, незручність або нездійснене бажання клієнта, яке вирішує продукт.", "Люди купують не продукт, а вирішення своєї ситуації. Болі шукають у реальних словах клієнтів: відгуках, коментарях, питаннях у дірект. Саме з них виходять найсильніші гачки.", "Біль: «зранку немає часу на сніданок». Контент: «Сніданок з собою за 3 хвилини — поки ти йдеш до зупинки»."], ["УТП", "Унікальна торгова пропозиція: конкретна перевага, яка відрізняє бізнес від конкурентів і має цінність саме для його аудиторії.", "УТП має бути конкретним і доказовим. «Якісний сервіс» і «найкраща кава» — не УТП, бо так пише кожен. Робоча формула: для кого + конкретний результат + доказ.", "«Єдина в районі кав'ярня, куди можна прийти з собакою: миска з водою і смаколики для пса — безкоштовно»."], ["Сезонність", "Регулярні коливання попиту, пов'язані з часом доби, днем тижня, порою року або святами.", "Сезонність враховують у контент-плані та рекламі: заздалегідь готують теми і пропозиції під піки попиту і продумують, як підтримати продажі в спокійні періоди.", "Пік у кав'ярні — 7:30–9:00 у будні. Тому пост про каву з собою виходить напередодні ввечері, а пропозиція на випічку — на тихі години після обіду."]],
  need:[["IG","Instagram і TikTok","пошук трендів"],["GM","Google Maps","відгуки про схожі заклади"],["AI","ChatGPT або Claude","перевірка і порівняння"],["XL","Таблиця «Ніша і конкуренти»","аркуш «Аналіз ніші»"]],
  files:["niche"],
  steps:[
   {t:"Прочитай бриф двічі",items:["Перший раз — просто прочитай, нічого не пишучи.","Другий раз — випиши собі факти: про бізнес, продукт, гостей, ціль, обмеження, тон.","Познач «дірки»: що важливо для SMM, але в брифі цього немає."],b:["Заповни бриф своєї справи в робочому полі нижче — так, ніби його читатиме сторонній SMM-спеціаліст.","Пиши конкретно: не «якісні послуги», а «манікюр з покриттям, що тримається 3 тижні».","Потім перечитай його очима чужої людини: чи все зрозуміло?"]},
   {t:"Сформулюй 3 відповіді",items:["Хто клієнт: бізнес, де він, який характер.","Що продаємо: продукт + результат для людини. Кав'ярня продає не лише каву, а спокійний старт дня.","Яка ціль: що має змінитися і до коли. Формула: що змінюється + наскільки + до якої дати."],tip:"У брифі немає цифр — тому ціль пишемо так, як є, і додаємо питання клієнту, як її виміряти."},
   {t:"Склади 3 уточнювальні питання",items:["Про цифри: скільки гостей зараз зранку? Скільки випічки лишається?","Про аудиторію: хто найчастіше повертається?","Про ресурси: хто може знімати, скільки часу є в Ірини на відповіді в дірект?"],b:["Запиши 3 питання про свою справу, на які тобі важко відповісти."]},
   {t:"Опиши нішу одним рядком",items:["Формула: хто ми + для кого + де.","Приклад: «dog-friendly кав'ярня біля дому для мешканців спального району»."]},
   {t:"Розбери аудиторію на 3 сегменти",items:["Для кожного сегмента: хто це, що болить, чого хоче, де сидить у соцмережах.","Підказка з брифу: люди по дорозі на роботу, власники собак, мами з дітьми, фрілансери.","Не пиши «усі, хто любить каву» — такий сегмент нічого не підказує для контенту."]},
   {t:"Збери мову клієнтів з відгуків",items:["Google Maps → пошук «кав'ярня» у твоєму місті → відкрий 3–5 закладів.","Вкладка «Відгуки» → прочитай 20–30 відгуків.","Випиши 5–10 фраз: за що хвалять і на що скаржаться. Дослівно, як писали люди."],tip:"Ці фрази — готові теми і гачки для постів: люди впізнають у них себе."},
   {t:"Знайди сезонність і тренди",items:["Сезонність: коли гостей більше і менше — ранок і вечір, будні і вихідні, зима і літо.","Тренди: у пошуку Instagram і TikTok введи «кав'ярня», «dog friendly», «сніданок» → вкладка Reels / Відео.","Випиши 3 формати, які часто повторюються (наприклад, «ранок бариста», «пес тижня»)."]},
   {t:"Сформулюй чернетку УТП",items:["Одне речення: чим цей бізнес відрізняється і чому це важливо саме його аудиторії.","Спирайся лише на факти з брифу."]},
   {t:"Порівняй з AI",items:["Скопіюй промпт нижче — у ньому вже є бриф.","Встав у ChatGPT або Claude → надішли.","Порівняй зі своїми відповідями: що AI помітив, а ти ні? Де він вигадав факт, якого немає в брифі?","Запиши висновок у 2–3 реченнях."]},
   {t:"Збережи роботу",items:["Натисни «Скопіювати відповіді дня» внизу → встав у Google Документ → збережи у папку 01 Бриф."]}
  ],
  mistakes:["Додавати факти, яких немає в брифі («у них найкраща кава в місті»).","Ціль «більше підписників» — вона не пов'язана з грошима клієнта.","Сегмент «усі» або «жінки 25–45» без болів і бажань.","Аналізувати нішу з голови, не прочитавши жодного відгуку."],
  check:["Є 3 відповіді, і вони спираються на бриф, а не на догадки.","Є 3 уточнювальні питання.","Описано 3 сегменти ЦА з болями і бажаннями.","Є 5+ фраз з відгуків, сезонність і 3 тренди.","Є чернетка УТП і порівняння з AI."]},

 {n:"02", title:"Аналіз конкурентів", sub:"Що вже роблять інші і чого бракує", time:"≈ 2 години",
  letterA:{from:"Ірина · власниця «Ранкової Лапки»", text:"Дякую за питання! Тепер хочу зрозуміти: що роблять інші кав'ярні і чим ми можемо відрізнятися?"},
  letterB:{from:"Ти · твоя справа", text:"Подивись на 3 конкурентів своєї справи так, як дивився б сторонній маркетолог."},
  why:"Конкуренти вже провели за тебе десятки тестів: видно, які теми і формати збирають реакції, а що лишається без уваги. Мета не скопіювати, а знайти вільне місце: те, чого не робить ніхто, але що важливо твоїй аудиторії.",
  example:"<b>Приклад великого бренду:</b> у 1962 році агенція DDB зробила для Avis кампанію «We try harder». Avis був другим після Hertz — і перетворив це на перевагу: «ми другі, тому стараємося більше». Сильна позиція часто народжується з чесного порівняння з конкурентом.",
  terms:[["Прямий конкурент", "Бізнес, який пропонує той самий продукт тій самій аудиторії в тому самому місці.", "Аналіз прямих конкурентів показує стандарти ніші: ціни, формати і теми, до яких аудиторія вже звикла, і де лишається вільне місце.", "Для «Ранкової Лапки» — інша кав'ярня в сусідньому дворі."], ["Непрямий конкурент", "Бізнес, який задовольняє ту саму потребу клієнта, але іншим способом або іншим продуктом.", "Непрямих конкурентів часто недооцінюють, хоча вони теж забирають клієнтів. Їх враховують, коли формулюють, чому варто обрати саме цей бізнес.", "Кавовий автомат на зупинці, кава з дому в термочашці, пекарня з кавою на виніс."], ["Шапка профілю", "Верхня частина профілю в Instagram: аватар, ім'я, біо, кнопки контактів, посилання та актуальне.", "Людина, яка вперше зайшла в профіль, за кілька секунд вирішує, чи підписатися. Шапка має відповісти на три питання: хто це, чим корисно мені, що робити далі. В аналізі конкурентів її розбирають першою.", "«Dog-friendly кав'ярня на Лісовій · Сніданки до 11:00 · Пн–Пт 7:00–19:00 · Бронь столика — в дірект»."], ["Формат", "Тип публікації за способом подачі: пост з одним фото, карусель (кілька фото чи відео в одному дописі), Reels (коротке вертикальне відео), сторіс, прямий ефір.", "Кожен формат має свою сильну сторону: Reels приводять нових людей, каруселі збирають збереження, сторіс підтримують щоденний контакт з підписниками. Баланс форматів — частина стратегії.", "Меню — каруселлю, атмосфера ранку — у Reels, «сьогодні свіжі круасани» — у сторіс."], ["Охоплення (Reach)", "Кількість унікальних людей, які побачили публікацію або профіль за певний період.", "Охоплення показує, скільки людей дізналися про бренд. Його дивляться в статистиці професійного акаунта. Не плутай з переглядами: одна людина може переглянути публікацію кілька разів.", "Reels набрав 3 000 переглядів і 2 400 охоплення — тобто його побачили 2 400 різних людей."], ["Залученість (ER)", "Engagement Rate — коефіцієнт залученості: наскільки активно аудиторія взаємодіє з контентом.", "Формула: (лайки + коментарі + збереження + репости) ÷ кількість підписників або охоплення × 100%. ER дає змогу порівнювати акаунти різного розміру: невеликий акаунт з активною аудиторією часто ефективніший за великий з неактивними підписниками.", "80 лайків + 12 коментарів + 8 збережень = 100 реакцій. Підписників 2 000. ER = 100 ÷ 2 000 × 100% = 5%."], ["Актуальне", "Збережені добірки сторіс, які показуються кружечками під біо і не зникають через 24 години.", "Актуальне працює як меню сайту: відповідає на часті питання ще до того, як людина напише в дірект. Порядок — від найважливішого для клієнта до другорядного.", "Меню · Ціни · Відгуки · Як дійти · Собаки-гості."]],
  need:[["IG","Instagram","перегляд профілів"],["GM","Google Maps","пошук конкурентів поруч"],["XL","Таблиця «Ніша і конкуренти»","аркуш «Конкуренти»"],["AI","ChatGPT або Claude","висновки без назв акаунтів"]],
  files:["niche"],
  steps:[
   {t:"Знайди 3 конкуренти",items:["Google Maps → «кав'ярня» → заклади поруч з твоїм домом або в центрі твого міста.","Відкрий картку закладу → знайди посилання на Instagram (або пошукай назву в Instagram).","Обери 2 прямі конкуренти з активним акаунтом (публікації за останній місяць) і 1 взірцевий — сильну кав'ярню з будь-якого міста."],b:["Знайди 2 прямі конкуренти своєї справи і 1 взірцевий акаунт у своїй ніші."]},
   {t:"Розбери шапку профілю",items:["Запиши кількість підписників.","Ім'я профілю: чи є в ньому ключове слово («кав'ярня»)?","Біо: що написано в кожному рядку? Є заклик?","Кнопки і посилання: куди веде посилання?","Актуальне: які добірки і в якому порядку?"]},
   {t:"Порахуй формати і частоту",items:["Прокрути останні 9–12 публікацій.","Порахуй, скільки серед них фото, каруселей і Reels.","Подивись дати: скільки публікацій було за останні 2 тижні."],tip:"Reels можна переглянути окремо у вкладці з іконкою відео в профілі."},
   {t:"Визнач теми",items:["До кожної з 9–12 публікацій допиши одне слово: продукт, люди, процес, акція, район, розвага.","Яка тема повторюється найчастіше?"]},
   {t:"Оціни візуал і спілкування",items:["Візуал: які кольори, світло, стиль? Однаковий чи різний?","Відкрий 3 пости з коментарями: чи відповідає акаунт людям? На «ти» чи на «ви»?","Які заклики в підписах: «приходь», «пиши в дірект», «збережи»?"]},
   {t:"Знайди найпопулярнішу публікацію",items:["У Reels видно кількість переглядів на обкладинці.","У постах порівняй кількість лайків і коментарів.","Запиши, яка публікація набрала найбільше і чому, на твою думку."]},
   {t:"Заповни таблицю і висновок",items:["Факти, а не враження: не «гарно», а «теплі кольори, денне світло, багато рук у кадрі».","Висновок у 3 реченнях: що роблять усі · чого не робить ніхто · що пропоную клієнту (з опорою на бриф)."]},
   {t:"Порівняй з AI",items:["Скопіюй промпт і встав свої нотатки — без назв акаунтів.","Викресли з відповіді AI усе, чого немає у твоїх нотатках.","Запиши, що AI помітив корисного і що вигадав."]}
  ],
  mistakes:["Оцінки замість фактів: «класний акаунт», «нудно».","Аналізувати акаунти, які не публікувалися пів року.","Копіювати чужі тексти й фото — це порушення авторських прав.","Писати конкурентам від імені клієнта."],
  check:["Таблиця заповнена для 3 конкурентів за всіма критеріями, там факти, а не оцінки.","Є висновок у 3 реченнях, і третє пов'язане з брифом.","Є порівняння з AI: що корисного він помітив і що вигадав."]},

 {n:"03", title:"Створюємо і оформлюємо Instagram", sub:"Професійний профіль з нуля", time:"≈ 2–3 години",
  letterA:{from:"Ірина · власниця «Ранкової Лапки»", text:"Наш старий Інстаграм я вела як виходило. Давайте почнемо з чистого аркуша: новий профіль, щоб з першого погляду було зрозуміло, хто ми."},
  letterB:{from:"Ти · твоя справа", text:"Сьогодні ти оформлюєш профіль своєї справи так, щоб за 5 секунд було зрозуміло, хто ти, для кого і як до тебе потрапити."},
  why:"Профіль — це вітрина. Людина, яка вперше зайшла, за кілька секунд вирішує, підписатися чи піти. Вона дивиться на аватар, ім'я, біо, актуальне і перші публікації. Твоя задача — щоб усі ці елементи разом відповідали на три питання: хто це, чим корисно мені, що робити далі.",
  warn:"Трек А — навчальний акаунт вигаданого бренду. Познач в біо: «Навчальний проєкт · вигаданий бренд». Не вказуй реальних адрес і телефонів, не приймай замовлень. Після тижня акаунт можна архівувати або видалити.",
  terms:[["Нікнейм (username)", "Унікальна адреса профілю після @, за якою тебе знаходять і відмічають. Лише латинські літери, цифри, крапка і підкреслення, до 30 символів.", "Нікнейм має бути коротким, легко читатися і запам'ятовуватися на слух. Якщо назва зайнята, додають місто або нішу, а не випадкові цифри.", "Добре: @rankova.lapka або @rankova.lapka.cafe. Погано: @rankova__lapka_2024x."], ["Ім'я профілю", "Жирний рядок під аватаром. На відміну від нікнейму, може бути кирилицею і містити пробіли.", "Instagram враховує ім'я профілю в пошуку, тому, крім назви, сюди додають ключове слово, яке ввела б потенційна клієнтка.", "«Ранкова Лапка · кав'ярня з собаками» знаходиться і за назвою, і за запитом «кав'ярня»."], ["Біо", "Короткий текстовий опис профілю, до 150 знаків.", "Біо — головний «продавець» у шапці. Робоча формула з 4 рядків: хто ми і для кого → чим відрізняємося → корисна інформація (години, адреса, як замовити) → заклик до дії.", "Dog-friendly кав'ярня для сусідів 🐾 / Домашня випічка від мами власниці / Пн–Пт 7:00–19:00 / Бронь столика — в дірект 👇"], ["Професійний акаунт", "Тип акаунта в Instagram для бізнесу або автора, на відміну від особистого.", "Відкриває статистику (охоплення, перегляди, дії в профілі), кнопки контактів, категорію і можливість запускати рекламу. Без статистики не можна оцінити, що працює, тому для роботи з клієнтом професійний акаунт обов'язковий.", "Після переходу під кожним дописом з'являється кнопка «Переглянути статистику»."], ["Категорія", "Сфера діяльності, яка показується сірим рядком під ім'ям профілю.", "Одразу пояснює новій людині, з ким вона має справу. Обирають найточнішу категорію зі списку.", "«Кав'ярня» точніше, ніж «Ресторан» чи «Місцевий бізнес»."], ["Обкладинки актуального", "Іконки-кружечки, які стоять на добірках актуального під біо.", "Обкладинки роблять в одному стилі й кольорах бренду: так профіль виглядає цілісно і професійно. Назви — короткі, до 10–12 символів, щоб не обрізалися.", "5 однакових обкладинок у кольорах бренду з простими іконками: Меню, Випічка, Собаки, Відгуки, Як дійти."], ["Закріплені публікації", "До 3 публікацій, які завжди стоять першими в сітці профілю, незалежно від дати.", "Їх бачить кожна нова людина, тому туди ставлять те, що найкраще знайомить з брендом: хто ми, головний продукт, відгуки або вигідна пропозиція.", "1 — «Хто ми», 2 — «Випічка від мами Ірини», 3 — «З собаками можна»."]],

   {t:"Додай актуальне",items:["«+» → «Історія» → обери highlight-menu.svg → опублікуй.","Відкрий цю історію → «Виділити» (сердечко з написом «Highlight») → «Нове» → назва «Меню» → «Додати».","Повтори для обкладинок: Випічка, Собаки, Відгуки, Як дійти.","Порядок у профілі: від найважливішого для гостя до другорядного."],b:["Створи 4–5 обкладинок у Canva: «Створити дизайн» → «Історія Instagram» → однотонний фон з кольору твого бренду + проста іконка в «Елементах» → «Завантажити» PNG."]},

 {n:"04", title:"Контент-план і перший пост", sub:"План на 2 тижні → дизайн → публікація", time:"≈ 2–3 години",

  example:"<b>Приклад великого бренду:</b> Red Bull у 2007 році створив власне медіа — Red Bull Media House — і роками публікує не рекламу напою, а постійні рубрики про спорт і пригоди. Рубрики роблять бренд впізнаваним навіть без продукту в кадрі.",
  terms:[["Контент-план", "Розклад публікацій на певний період: дата, рубрика, формат, тема, ціль, гачок і потрібні матеріали.", "Контент-план тримає системність: публікації виходять регулярно, а не «коли є натхнення», і в акаунті зберігається баланс продажу, довіри і залучення. З клієнтом план погоджують заздалегідь, зазвичай на 2–4 тижні.", "Пн — Reels «ранок бариста» (впізнаваність) · Ср — карусель «наша випічка» (довіра) · Пт — пост-опитування «яку випічку додати?» (залучення)."], ["Рубрика", "Постійна тематична лінія акаунта, яка регулярно повторюється.", "3–5 рубрик формують «обличчя» акаунта: підписники знають, чого чекати, а спеціалісту легше генерувати ідеї. Рубрики виводять з ЦА, болів і УТП.", "«Випічка від мами», «Собаки району», «Ранок у Лапці», «Сусіди радять»."], ["Ціль публікації", "Результат, якого має досягти конкретна публікація.", "Основні цілі: впізнаваність (дізналися нові люди), довіра (переконалися, що бізнесу можна довіряти), залучення (відреагували, написали, зберегли), продаж (прийшли, купили, забронювали). Ціль визначає формат, текст і заклик.", "Відгук гостя з фото — довіра. «Покажи цей пост бариста і отримай каву зі знижкою» — продаж."], ["Гачок", "Перший рядок тексту або перші 1–2 секунди відео, завдання яких — зупинити прокрутку стрічки.", "Людина за секунду вирішує, читати чи гортати далі. Сильні гачки: питання, несподіваний факт, конкретна цифра, звернення до болю або впізнавана ситуація.", "«Твій пес теж тягне тебе в кав'ярню зранку?» замість «Доброго ранку, друзі!»."], ["Tone of voice", "Тон спілкування бренду: як він говорить з аудиторією в текстах, коментарях і дірект.", "Тон фіксують заздалегідь (на «ти» чи на «ви», з гумором чи стримано, які слова використовуємо, а яких уникаємо) і дотримуються його в усіх текстах. Так бренд звучить упізнавано, навіть коли пишуть різні люди.", "«Ранкова Лапка»: тепло, по-сусідському, на «ти», з легким гумором, без канцеляриту."], ["Заклик до дії (CTA)", "Call to Action — одна конкретна дія, яку ми просимо зробити після прочитання.", "Один пост — один заклик. Коли закликів кілька, людина не робить жодного. Заклик має відповідати цілі публікації.", "«Збережи, щоб не загубити меню» · «Напиши „+“ у коментарях» · «Приходь завтра до 9:00 — круасан до кави за пів ціни»."], ["Хештег", "Слово або фраза зі знаком #, за якими публікацію можна знайти в пошуку.", "Хештеги допомагають Instagram зрозуміти тему допису. Працюють 3–5 точних хештегів: місто, ніша, особливість. 30 випадкових хештегів виглядають як спам.", "#кавʼярнякраків #dogfriendly #сніданоккраків"], ["Альтернативний текст", "Текстовий опис зображення, який озвучують програми зчитування екрана для людей з порушеннями зору.", "Робить контент доступним для всіх і допомагає Instagram розуміти, що на фото. Додається під час публікації: «Додаткові налаштування» → «Альтернативний текст».", "«Круасан і чашка капучино на дерев'яному столі біля вікна»."]],

   {t:"Створи дизайн поста в Canva",items:["Canva → «Створити дизайн» → «Власний розмір» → 1080 × 1350 px → «Створити».","Ліворуч «Завантаження» → «Завантажити файли» → фото з пакета для першої теми плану.","Перетягни фото на полотно → потягни за кути, щоб воно заповнило весь фон.","«Текст» → «Додати заголовок» → до 6 слів → шрифт Montserrat, жирний.","Колір тексту — з brand kit: #FFFFFF на темному фото або #5B3A29 на світлому. Для контрасту: «Елементи» → «Прямокутник» → колір #D2693C → під текст.","Перевірка: зменш масштаб до розміру телефона — чи читається напис за 2 секунди?","«Поділитися» → «Завантажити» → тип PNG → збережи у папку 05 Пост."],b:["Використай своє фото і кольори свого бренду. Не більше 2 шрифтів і 2 кольорів на дизайні."],tip:"Приклади макетів — у файлах цього дня. Це орієнтир, не шаблон для копіювання."},

<script>
/* ===== Стан ===== */
var TESTMODE = /[?&]test=1/.test(location.search);
var TESTFRESH = TESTMODE && /[?&]fresh=1/.test(location.search);
var AUTH_UID = TESTMODE ? "review" : (localStorage.getItem("mk_auth_uid")||"");
var KEY = TESTMODE ? "smm-ai-review-v16" : "smm-ai-week0-v3-"+AUTH_UID;
var STORE = TESTMODE ? sessionStorage : localStorage;
if(TESTFRESH){ try{ STORE.removeItem(KEY); STORE.removeItem(KEY+"-dirty"); }catch(e){} }
var S = load();
function load(){ try{ var r = STORE.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return {name:"",track:TESTMODE?"A":"",about:"",f:{},done:{},view:TESTMODE?"d0":"welcome"}; }
function save(noBump){ if(!noBump){ S.updated=Date.now(); SYNC.dirty=true; } try{ STORE.setItem(KEY, JSON.stringify(S)); }catch(e){} schedulePush(); }

/* ===== Хмарна синхронізація (прогрес на будь-якому пристрої) =====
   Принцип: хмара — головна копія. На сервер ідуть лише змінені поля (DF),

var DKEY = KEY+"-dirty";
var SYNC={t:null,ready:false,state:"",dirty:false,busy:false};
var DF=(function(){ try{ return JSON.parse(STORE.getItem(DKEY)||"{}")||{}; }catch(e){ return {}; } })();
function saveDF(){ try{ STORE.setItem(DKEY, JSON.stringify(DF)); }catch(e){} }
var URLKEY=(function(){ var m=location.search.match(/[?&]u=([^&#]+)/); if(!m) return ""; var v=""; try{ v=decodeURIComponent(m[1]).trim(); }catch(e){} if(/^\d{3,}$/.test(v)) return "tg"+v; if(/^[A-Za-z0-9_-]{3,64}$/.test(v)) return "id_"+v.toLowerCase(); return ""; })();
function normKey(k){ return String(k||"").trim().toLowerCase().replace(/^@+/,"").replace(/\s+/g,""); }
function syncOn(){ return !TESTMODE && !!AUTH_UID && !!window.MKCloud; }
function setSync(st){ SYNC.state=st; var el=document.getElementById("syncst"); if(el) el.textContent = st==="saving"?"зберігаю…":st==="ok"?"збережено в хмарі ✓":st==="err"?"немає зв'язку — збережу пізніше":""; }
function schedulePush(){ if(!syncOn()||!S.key||!SYNC.ready||!SYNC.dirty) return; clearTimeout(SYNC.t); SYNC.t=setTimeout(push,1200); }
function payload(){ var f={}, ft={}; Object.keys(DF).forEach(function(k){ if(S.f[k]!==undefined) f[k]=S.f[k]; if(S.ft&&S.ft[k]!==undefined) ft[k]=S.ft[k]; });
  return {k:S.key, data:{name:S.name||"", track:S.track||"", about:S.about||"", done:S.done||{}, f:f, ft:ft, updated:S.updated||0, view:S.view}}; }
function push(){ if(!syncOn()||!S.key) return Promise.resolve();
  if(SYNC.busy){ clearTimeout(SYNC.t); SYNC.t=setTimeout(push,1500); return Promise.resolve(); }
  SYNC.busy=true; setSync("saving");
  var body=payload(), sent=body.data.f;
  return window.MKCloud.save(body.data)
    .then(function(j){ SYNC.busy=false;
      if(j&&j.ok){ Object.keys(sent).forEach(function(k){ if(S.f[k]===sent[k]) delete DF[k]; }); saveDF();
        if(!Object.keys(DF).length) SYNC.dirty=false; setSync("ok"); if(SYNC.dirty) schedulePush(); }
      else { setSync("err"); SYNC.t=setTimeout(push,15000); } })
    .catch(function(){ SYNC.busy=false; setSync("err"); clearTimeout(SYNC.t); SYNC.t=setTimeout(push,15000); }); }
/* Дані з хмари перевіряються: лише очікувані поля і типи (захист від підкинутого коду) */
function clean(d){ if(!d||typeof d!=="object") return null;
  var o={name:String(d.name||"").slice(0,200), track:(d.track==="A"||d.track==="B"||d.track==="C")?d.track:"", about:String(d.about||"").slice(0,500), f:{}, ft:{}, done:{}, updated:+d.updated||0,
    view:/^d[0-5]$|^(welcome|dash|final)$/.test(String(d.view||""))?String(d.view):"dash"};
  Object.keys(d.f||{}).forEach(function(k){ if(/^[\w-]{1,40}$/.test(k) && d.f[k]!=null) o.f[k]=String(d.f[k]).slice(0,20000); });
  Object.keys(d.ft||{}).forEach(function(k){ if(/^[\w-]{1,40}$/.test(k)) o.ft[k]=+d.ft[k]||0; });
  Object.keys(d.done||{}).forEach(function(k){ if(/^[0-5]$/.test(k) && d.done[k]) o.done[k]=String(d.done[k]).slice(0,40); });
  return o; }
function pull(key){ return window.MKCloud.load().then(function(data){
  if(data) return clean(data);
  if(!URLKEY||!CONFIG.LEGACY_SYNC_URL) return null;
  var legacy=/^\d{3,}$/.test(URLKEY)?"tg"+URLKEY:"id_"+URLKEY.toLowerCase();
  return fetch(CONFIG.LEGACY_SYNC_URL+"?k="+encodeURIComponent(legacy)+"&t="+Date.now())
    .then(function(r){return r.json();}).then(function(j){ var old=j&&j.ok?clean(j.data):null; if(old) return window.MKCloud.save(old).then(function(){ try{ history.replaceState(null,"",location.pathname); }catch(e){} return old;}); return null; })
    .catch(function(){return null;});
}); }
function doneOf(x){ var c=0; for(var i=0;i<6;i++) if(x&&x.done&&x.done[i]) c++; return c; }
function hasData(x){ return !!(x && (x.name || x.track || doneOf(x) || Object.keys(x.f||{}).length)); }
/* Об'єднання: незбережені тут правки (DF) завжди лишаються; решта — з хмари;
   те, чого в хмарі немає, лишається і позначається на відправку. Нічого не губиться. */
function merge(local, remote){
  var m=JSON.parse(JSON.stringify(local)); m.f=m.f||{}; m.done=m.done||{};
  if(!remote) { Object.keys(m.f).forEach(function(k){ if(m.f[k]) DF[k]=(m.ft&&m.ft[k])||1; }); saveDF(); return m; }
  var rf=remote.f||{}, rt=remote.ft||{}, first=!local.synced; m.ft=m.ft||{};
  Object.keys(rf).forEach(function(k){ var rv=rf[k], lv=m.f[k];
    if(rv===lv){ delete DF[k]; if((rt[k]||0)>(m.ft[k]||0)) m.ft[k]=rt[k]; return; }   // вже однакові
    if(DF[k] && (m.ft[k]||DF[k]||0) >= (rt[k]||0)) return;                            // наша правка новіша й ще не відправлена — лишаємо
    if(first && !DF[k] && lv && String(lv).length>String(rv||"").length){ DF[k]=m.ft[k]||1; return; } // перше з'єднання: довша відповідь
    m.f[k]=rv; if(rt[k]) m.ft[k]=rt[k]; delete DF[k]; });
  Object.keys(m.f).forEach(function(k){ if(m.f[k] && (rf[k]===undefined||rf[k]==="")) DF[k]=m.ft[k]||1; });
  Object.keys(remote.done||{}).forEach(function(k){ if(!m.done[k] && remote.done[k]) m.done[k]=remote.done[k]; });
  ["name","track","about"].forEach(function(k){ if(!m[k] && remote[k]) m[k]=remote[k]; });
  if((remote.updated||0)>(m.updated||0)) m.updated=remote.updated;
  saveDF(); return m; }
function typing(){ var a=document.activeElement; return a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"); }
function syncNow(){ if(!syncOn()||!S.key||SYNC.pulling) return;
  var key=S.key; SYNC.pulling=true;
  pull(key).then(function(remote){ SYNC.pulling=false; if(S.key!==key) return;
      var before=JSON.stringify(S), view=S.view; var m=merge(S,remote); m.key=key; m.synced=true; if(view) m.view=view; if(m.view==="welcome"&&m.track) m.view="dash";
      var needPush = !remote || Object.keys(DF).length>0 || doneOf(m)>doneOf(remote) || (!remote.name&&m.name) || (!remote.track&&m.track);
      S=m; SYNC.ready=true; save(true);
      if(needPush){ SYNC.dirty=true; clearTimeout(SYNC.t); push(); } else setSync("ok");
      if(JSON.stringify(S)!==before && !typing()) render(); })
    .catch(function(){ SYNC.pulling=false; SYNC.ready=true; setSync("err"); if(SYNC.dirty) schedulePush(); }); }
function syncBeforeFirstRender(){
  var app=document.getElementById("app"), key=S.key;
  app.innerHTML='<section class="hero stack" style="min-height:52vh;justify-content:center"><span class="pill">МК SMM 1.0</span><h1>Відновлюю твій прогрес…</h1><p class="muted">Секунду: завантажую твої відповіді, щоб ти продовжила з того самого місця.</p></section>';
  SYNC.pulling=true;
  pull(key).then(function(remote){
    SYNC.pulling=false; if(S.key!==key) return;
    var m=merge(S,remote); m.key=key; m.synced=true;
    if(remote && remote.view) m.view=remote.view;
    if(m.view==="welcome"&&m.track) m.view="dash";
    var needPush=!remote||Object.keys(DF).length>0||doneOf(m)>doneOf(remote)||(!remote.name&&m.name)||(!remote.track&&m.track);
    S=m; SYNC.ready=true; save(true);
    if(needPush){ SYNC.dirty=true; clearTimeout(SYNC.t); push(); } else setSync("ok");

  }).catch(function(){
    SYNC.pulling=false; SYNC.ready=true; setSync("err");
    app.innerHTML='<section class="hero stack" style="min-height:52vh;justify-content:center"><span class="pill">Зв\'язок перервався</span><h1>Не вдалося завантажити прогрес</h1><p class="muted">Твої дані не стерті. Перевір інтернет і натисни кнопку ще раз.</p><div class="row"><button class="btn" type="button" id="syncRetry">Спробувати ще раз</button></div></section>';
    var b=document.getElementById("syncRetry"); if(b) b.onclick=syncBeforeFirstRender;

function connect(raw){ var key=normKey(raw); if(!key){ toast("Вкажи нік у Telegram або email"); return; }
  if(!syncOn()){ S.key=key; save(); render(); return; }
  toast("Шукаю твій прогрес…");
  pull(key).then(function(remote){ if(!hasData(remote) && !hasData(S)){ toast("Не знайшла прогрес за «"+key+"». Перевір нік або email і спробуй ще раз"); return; } var m=merge(S,remote); m.key=key; m.synced=true; m.view = m.track ? "dash" : "welcome";
      S=m; SYNC.ready=true; SYNC.dirty=true; save(true); push(); render(); toast(hasData(remote)?"Прогрес відновлено ✓":"Готово: прогрес зберігається в хмарі"); })
    .catch(function(){ toast("Немає зв'язку. Спробуй ще раз за хвилину"); }); }

function saveFile(key){

  var name=f.path.split("/").pop();
  var p=f.b64 ? Promise.resolve(new Blob([Uint8Array.from(atob(f.b64),function(c){return c.charCodeAt(0);})])) : fetch(f.path).then(function(r){return r.blob();});
  p.then(function(b){ var u=URL.createObjectURL(b); var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},4000); toast("Файл збережено в «Завантаження»"); },
         function(){ toast("Не вдалося зберегти. Натисни «Відкрити»"); });
}

   '<section class="grid2"><div class="card stack"><h3>Твій тиждень</h3><p>Трек: <b>'+(S.track==="A"?"А · «Ранкова Лапка»":"Б · власна справа")+'</b></p>'+DAYS.map(function(d,i){return '<p class="small">'+(i===0?"Старт":"День "+i)+' · '+d.title+': <b style="color:var(--mint)">'+(S.done[i]?"здано "+esc(S.done[i]):"—")+'</b></p>';}).join("")+'</div>'+
   '<div class="card stack"><h3>Твоя самооцінка</h3><div class="total gt">'+(n?sum+" / 12":"—")+'</div><p class="small">Після Zoom ти отримаєш особистий лист: запрошення в навчання або пояснення, чому поки ні, і що підтягнути.</p><p>'+esc(CONFIG.ZOOM_TEXT)+'</p></div></section>'+
   '<section class="row"><button type="button" class="btn ghost" data-copyall="1">Скопіювати всі мої відповіді</button>'+(CONFIG.BOT?'<a class="btn" href="https://t.me/'+esc(CONFIG.BOT)+'?start=6abfc3a54f310df5b2040566" target="_blank" rel="noopener">Повідомити в боті, що тиждень пройдено</a>':'<a class="btn" href="index.html#price">Переглянути формати навчання</a>')+'</section>';
}

/* ===== Текст для здачі ===== */
function dayText(i){
  var lines=["Тиждень 0 · "+(i===0?"Старт":"День "+i)+" · "+DAYS[i].title,"Учасник: "+S.name,"Трек: "+S.track+(S.track==="B"&&S.about?" ("+S.about+")":""),""];
  var steps=DAYS[i].steps.length, dn=0; for(var j=0;j<steps;j++) if(v("g"+i+"_"+j)) dn++;
  lines.push("Кроків інструкції виконано: "+dn+" з "+steps,"");
  document.querySelectorAll("#app [data-k]").forEach(function(el){
    var k=el.getAttribute("data-k"); if(/^chk|^rc|^g\d/.test(k)) return;
    if(el.type==="radio" && !el.checked) return;
    var val=el.value; if(!val) return;
    var lab=el.closest("label.f"), name="";
    if(lab){ name=(lab.childNodes[0].textContent||"").trim(); }
    else if(el.type==="radio"){ var g=el.closest("[role=radiogroup]"); name=g?g.getAttribute("aria-label"):""; }
    else if(el.closest(".tbl td")){ var tr=el.closest("tr"); var ci=[].indexOf.call(tr.children, el.closest("td")); name=(tr.querySelector("th").childNodes[0].textContent)+" · Конкурент "+ci; }
    else if(el.closest(".cp td")){ var tr2=el.closest("tr"); name="План · публікація "+tr2.children[0].textContent+" · "+({d:"дата",r:"рубрика",f:"формат",t:"тема",g:"ціль",h:"гачок",m:"матеріал"})[k.slice(-1)]; }
    else if(el.closest(".frame")){ name="Кадр "+(+k.slice(-1)+1)+(k[1]==="w"?" · що в кадрі":" · текст"); }
    lines.push((name?name+": ":"")+val);
  });
  if(i===5){ var s=0; for(var q=0;q<4;q++) s+=+(v("sc"+q)||0); lines.push("Самооцінка за рубрикою: "+["Виконані задачі","Вчасність","Якість","Мотивація"].map(function(c,q){return c+" "+(v("sc"+q)||"–");}).join(", ")+" · разом "+s+"/12"); }
  return lines.join("\n");
}

/* ===== Події ===== */
function bind(){
  var app=document.getElementById("app");
  app.querySelectorAll("[data-k]").forEach(function(el){
    var ev=(el.type==="checkbox"||el.type==="radio"||el.tagName==="SELECT")?"change":"input";
    el.addEventListener(ev,function(){
      var k=el.getAttribute("data-k");
      set(k, el.type==="checkbox" ? (el.checked?"1":"") : el.value);
      if(el.getAttribute("data-step")) el.closest(".gstep").classList.toggle("ok", el.checked);
      live();
    });
  });
  app.querySelectorAll("[data-pr]").forEach(function(b){ b.onclick=function(){ copy(PR[+b.getAttribute("data-pr")]()); }; });
  app.querySelectorAll("[data-copytext]").forEach(function(b){ b.onclick=function(){ copy(BRIEF_A); }; });
  app.querySelectorAll("[data-file]").forEach(function(b){ b.onclick=function(){ saveFile(b.getAttribute("data-file")); }; });
  app.querySelectorAll("[data-go]").forEach(function(b){ b.onclick=function(){ S.view=b.getAttribute("data-go"); save(); render(); }; });
  app.querySelectorAll("[data-open]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-open"); if(!unlocked(i)){ toast(!dateOpen(i) ? "День "+i+" відкриється "+openLabel(i)+" (час Албанії)" : "Спершу здай попередній день"); return; } S.view="d"+i; save(); render(); }; });
  app.querySelectorAll("[data-final]").forEach(function(b){ b.onclick=function(){ if(doneCount()<6){ toast("Фінал відкриється після Дня 5"); return; } S.view="final"; save(); render(); }; });
  app.querySelectorAll("[data-copyday]").forEach(function(b){ b.onclick=function(){ copy(dayText(+b.getAttribute("data-copyday"))); }; });
  app.querySelectorAll("[data-submit]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-submit");
    copy(dayText(i));
    if(!S.done[i]){ var d=new Date(); S.done[i]=d.toLocaleDateString("uk-UA")+" о "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}); }
    S.view = i<5 ? "d"+(i+1) : "final"; save(); clearTimeout(SYNC.t); if(S.key&&SYNC.ready) push();
    setTimeout(function(){ render(); window.scrollTo(0,0); }, 400); }; });
  app.querySelectorAll("[data-goto]").forEach(function(a){ a.onclick=function(e){ e.preventDefault(); S.view=a.getAttribute("data-goto"); save(); render(); window.scrollTo(0,0); }; });
  app.querySelectorAll("[data-copyall]").forEach(function(b){ b.onclick=function(){ var out=[]; for(var i=0;i<6;i++){ document.getElementById("app").innerHTML=dayView(i); out.push(dayText(i)); } render(); copy(out.join("\n\n———\n\n")); }; });
  app.querySelectorAll("[data-done]").forEach(function(b){ b.onclick=function(){
    var i=+b.getAttribute("data-done");
    if(!S.done[i]){ var d=new Date(); S.done[i]=d.toLocaleDateString("uk-UA")+" о "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}); save(); }
    if(i<5 && !dateOpen(i+1)){ toast("Здано 💚 День "+(i+1)+" відкриється "+openLabel(i+1)); S.view="dash"; save(); render(); return; }
    toast(i<5?"День "+(i+1)+" відкрито":"Фінал відкрито");
    S.view = i<5 ? "d"+(i+1) : "final"; save(); render();
  }; });
  app.querySelectorAll("[data-score]").forEach(function(b){ b.onclick=function(){ set(b.getAttribute("data-score"), b.getAttribute("data-val")); app.querySelectorAll('[data-score="'+b.getAttribute("data-score")+'"]').forEach(function(x){x.setAttribute("aria-pressed", x===b?"true":"false");}); live(); }; });
  var rs=document.getElementById("reset"); if(rs) rs.onclick=function(){ if(rs.dataset.sure){ S={name:"",track:"",about:"",f:{},done:{},view:"welcome",key:""}; save(); render(); } else { rs.dataset.sure="1"; rs.textContent="Натисни ще раз, щоб стерти всі відповіді"; } };
  var nm=document.getElementById("f_name"); if(nm) nm.oninput=function(){ S.name=nm.value; save(); };
  var ab=document.getElementById("f_about"); if(ab) ab.oninput=function(){ S.about=ab.value; save(); };
  app.querySelectorAll("[data-track]").forEach(function(b){ b.onclick=function(){ S.track=b.getAttribute("data-track"); save(); app.querySelectorAll("[data-track]").forEach(function(x){x.setAttribute("aria-pressed", x===b?"true":"false");}); document.getElementById("aboutWrap").hidden = S.track!=="B"; }; });
  var sb=document.getElementById("startBtn"); if(sb) sb.onclick=function(){ if(!S.name.trim()){ toast("Вкажи ім'я"); nm.focus(); return; } if(!S.track){ toast("Обери трек"); return; } var kk=document.getElementById("f_key"); if(kk && syncOn()){ if(!normKey(kk.value)){ toast("Вкажи нік у Telegram або email"); kk.focus(); return; } S.view="dash"; connect(kk.value); return; } S.view="dash"; save(); render(); };
  var rb=document.getElementById("restoreBtn"); if(rb) rb.onclick=function(){ connect(document.getElementById("f_rkey").value); };
  var kb=document.getElementById("keyBtn2"); if(kb) kb.onclick=function(){ connect(document.getElementById("f_key2").value); };
  setSync(SYNC.state);
  live();
}
function live(){
  PR.forEach(function(fn,id){ var el=document.getElementById("pr_"+id); if(el) el.textContent=fn(); });
  document.querySelectorAll("[data-max]").forEach(function(t){ var c=document.querySelector('.count[data-for="'+t.getAttribute("data-k")+'"]'); if(c){ var n=t.value.length, m=+t.getAttribute("data-max"); c.textContent=n+" / "+m+" знаків"; c.classList.toggle("over", n>m); } });
  var cap=document.getElementById("pv_cap");
  if(cap){ var who=S.track==="A"?"rankova.lapka":"твій.акаунт"; var txt=[v("hook"),v("body"),v("cta"),v("tags")].filter(Boolean).join("\n\n"); cap.innerHTML="<b>"+esc(v("un")||who)+"</b>"+esc(txt||"Тут з'явиться твій підпис: гачок, суть, заклик і хештеги."); document.getElementById("pv_img").textContent=v("vtext")||"Напис до 6 слів"; var acc=document.getElementById("pv_acc"); if(acc) acc.textContent=v("un")||who; }
  var un=document.getElementById("pv_un");
  if(un){ var u=v("un"); un.textContent=u||"нікнейм"; document.getElementById("pv_pn").textContent=v("pn")||"Ім'я профілю"; document.getElementById("pv_cat").textContent=v("cat")||"Категорія"; document.getElementById("pv_bio").textContent=v("bio"); document.getElementById("pv_lnk").textContent=v("lnk");
    var hl=(v("hls")||"Меню, Випічка, Собаки, Відгуки, Як дійти").split(",").map(function(s){return s.trim();}).filter(Boolean).slice(0,6);
    var imgs=["menu","vypichka","sobaky","vidguky","yak-diyty"];
    document.getElementById("pv_hl").innerHTML=hl.map(function(n,j){return '<div><i>'+(S.track==="A"&&imgs[j]?'<img src="files/highlight-'+imgs[j]+'.svg" alt="">':'')+'</i>'+esc(n)+'</div>';}).join("");
    var ck=document.getElementById("unCheck"); if(ck){ if(!u) ck.textContent=""; else if(!/^[a-z0-9._]{1,30}$/i.test(u)) { ck.textContent="✕ Лише латиниця, цифри, крапка і _, до 30 символів"; ck.style.color="var(--copper)"; } else if(/\.\.|^\.|\.$/.test(u)){ ck.textContent="✕ Без двох крапок підряд і крапки на початку чи в кінці"; ck.style.color="var(--copper)"; } else { ck.textContent="✓ Формат нікнейму правильний. Чи вільний він — покаже Instagram."; ck.style.color="var(--mint)"; } }
  }
  var cpc=document.getElementById("cpCheck");
  if(cpc){ var rows=[]; for(var r=0;r<8;r++) rows.push({r:v("cp"+r+"r"),f:v("cp"+r+"f"),g:v("cp"+r+"g")});
    var filled=rows.filter(function(x){return x.r&&x.f&&x.g;}).length, reels=rows.filter(function(x){return x.f==="Reels";}).length, streak=0, bad=false, prev="";
    rows.forEach(function(x){ if(x.r&&x.r===prev){streak++; if(streak>=2) bad=true;} else streak=0; prev=x.r; });
    var goals=["Впізнаваність","Довіра","Залучення","Продаж"].filter(function(g){return rows.some(function(x){return x.g===g;});}).length;
    cpc.innerHTML="Перевірка плану: заповнено "+filled+" з 8 · Reels: "+reels+(reels>=2?" ✓":" (потрібно 2 — по одному на тиждень)")+" · цілей охоплено: "+goals+" з 4"+(bad?' · <span style="color:var(--copper)">3 публікації поспіль з однієї рубрики — перемішай</span>':""); }
  for(var f=0;f<5;f++){ var sc=document.getElementById("sc_"+f); if(sc) sc.textContent=v("st"+f)||"текст на екрані"; }
  var rc=document.getElementById("repCount"); if(rc){ var n=["r1","r2","r3","r4"].reduce(function(a,k){return a+v(k).length;},0); rc.textContent="Звіт: "+n+" / 1200 знаків"; rc.classList.toggle("over", n>1200); }
  var tt=document.getElementById("scTotal"); if(tt){ var s=0,c=0; for(var j=0;j<4;j++){ if(v("sc"+j)!==""){s+=+v("sc"+j);c++;} } tt.textContent=c?s+" / 12":"—"; }
}
document.getElementById("home").onclick=function(){ if(S.track){ S.view="dash"; save(); render(); } };
/* ===== Режим перегляду для Маші: simulator.html?review=<telegram id або ключ> =====
   Лише читає відповіді з хмари. Нічого не зберігає на цьому пристрої і нічого не відправляє. */
var REVIEW=(function(){ var m=location.search.match(/[?&]review(?:=([^&#]*))?/); if(!m) return null; var v=""; try{ v=decodeURIComponent(m[1]||"").trim(); }catch(e){} if(/^\d{3,}$/.test(v)) return "tg"+v; return v; })();
function reviewStart(){
  var ADM=(location.search.match(/[?&]admin=([A-Za-z0-9_-]{8,64})/)||[])[1]||"";
  try{ if(ADM) localStorage.setItem("smm-admin",ADM); else ADM=localStorage.getItem("smm-admin")||""; }catch(e){}
  var Q=ADM?"&admin="+encodeURIComponent(ADM):"";
  save=function(){}; saveDF=function(){}; schedulePush=function(){}; push=function(){ return Promise.resolve(); };
  var app=document.getElementById("app");
  function form(msg){ app.innerHTML='<section class="hero"><span class="pill">Перегляд відповідей · лише для Маші</span><h1>Відповіді учасника</h1><p class="muted">Встав Telegram ID або ключ з таблиці прогресу (колонка «Ключ», наприклад tg123456789).</p>'+(msg?'<p class="warn">'+esc(msg)+'</p>':'')+'<label class="f">Ключ<input id="rvk" type="text" placeholder="tg123456789"></label><div class="row"><button class="btn" id="rvgo" type="button">Показати відповіді →</button></div></section>';
    document.getElementById("rvgo").onclick=function(){ var k=document.getElementById("rvk").value.trim(); if(k) location.search="?review="+encodeURIComponent(k)+Q; }; }
  function listView(){
    app.innerHTML='<section class="hero"><h1>Завантажую список…</h1></section>';
    fetch(CONFIG.SYNC_URL+"?list="+encodeURIComponent(ADM)+"&t="+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.ok||!j.list){ form(j&&j.error==="denied"?"Ключ доступу не підходить.":"Список поки недоступний. Перевір, що код у Google оновлено."); return; }
      var L=j.list.filter(function(x){ return !/^(claude_test|tg999000)/.test(x.k); }).sort(function(a,b){ return (b.done-a.done)||(b.updated-a.updated); });
      var h='<section class="hero"><span class="pill">Лише для Маші</span><h1>Відповіді учасників</h1><p class="muted">'+L.length+' учасників у хмарі. Натисни на ім\'я, щоб побачити всі відповіді. Зберігай цю сторінку в закладках.</p></section><section class="stack">';
      L.forEach(function(x){ var d=x.updated?new Date(x.updated):null;
        h+='<a class="term" style="text-decoration:none;color:inherit" href="?review='+encodeURIComponent(x.k)+Q+'"><b>'+esc(x.name||"Без імені")+'</b><p class="td">Здано '+x.done+' з 6 · '+esc(x.last)+(x.track?' · трек '+esc(x.track):'')+'</p>'+(d?'<p class="tp">Остання активність: '+d.toLocaleString("uk-UA",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})+'</p>':'')+'</a>'; });
      app.innerHTML=h+'</section>'; window.scrollTo(0,0);
    }).catch(function(){ form("Немає зв\'язку з хмарою. Спробуй ще раз за хвилину."); });
  }
  if(!REVIEW){ if(ADM && syncOn()) listView(); else form(""); return; }
  if(!syncOn()){ form("Хмарне збереження вимкнене."); return; }
  app.innerHTML='<section class="hero"><h1>Завантажую відповіді…</h1></section>';
  pull(REVIEW).then(function(d){
    if(!d||!hasData(d)){ form("За ключем «"+REVIEW+"» відповідей не знайдено."); return; }
    S={name:d.name||"",track:d.track||"",about:d.about||"",f:d.f||{},done:d.done||{},view:"dash"};
    var out=[];
    for(var i=0;i<6;i++){ app.innerHTML=dayView(i); var t=dayText(i); var filled=t.split("\n").slice(6).some(function(l){ return l && !/^Самооцінка за рубрикою: .*разом 0\/12$/.test(l); }) || !!S.done[i]; out.push({i:i,t:t,filled:filled}); }
    var c=doneOf(S);
    var h='<section class="hero">'+(ADM?'<div class="row"><a class="btn ghost sm" href="?review'+Q+'">← Усі учасники</a></div>':'')+'<span class="pill">Перегляд відповідей · лише для Маші</span><h1>'+esc(S.name||"Без імені")+'</h1><p class="muted">Трек '+esc(S.track==="A"?"А · «Ранкова Лапка»":S.track==="B"?"Б · власна справа"+(S.about?" ("+S.about+")":""):"не обрано")+' · здано '+c+' з 6 · ключ '+esc(REVIEW)+'</p></section>';
    out.forEach(function(o){
      var st=S.done[o.i]?'✓ Здано '+esc(S.done[o.i]):(o.filled?'Почато, не здано':'Ще не почато');
      h+='<section class="stack"><div class="sec-title"><i>'+(o.i===0?"S":o.i)+'</i><h2>'+(o.i===0?"Старт":"День "+o.i)+' · '+esc(DAYS[o.i].title)+'</h2></div><p class="muted">'+st+'</p>'+(o.filled?'<pre class="rvt" style="white-space:pre-wrap;margin:0;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);font:inherit;font-size:.92rem;line-height:1.55">'+esc(o.t)+'</pre><div class="row"><button class="btn ghost" type="button" data-rvc="'+o.i+'">Скопіювати</button></div>':'')+'</section>';
    });
    app.innerHTML=h; window.scrollTo(0,0);
    app.querySelectorAll("[data-rvc]").forEach(function(b){ b.onclick=function(){ copy(out[+b.getAttribute("data-rvc")].t); }; });
  }).catch(function(){ form("Немає зв'язку з хмарою. Спробуй ще раз за хвилину."); });
}
if(REVIEW!==null){ reviewStart(); } else {
/* Старт: особисте посилання з бота */
if(syncOn()){ S.key="user_"+AUTH_UID; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
try{ if(TESTMODE && TESTFRESH && history.replaceState) history.replaceState(null,"",location.pathname+"?test=1"); }catch(e){}
if(syncOn() && S.key){ syncBeforeFirstRender(); }
else { render(); SYNC.ready=true; }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") syncNow(); else flushBeacon(); });
window.addEventListener("pagehide",flushBeacon);
setInterval(function(){ if(document.visibilityState==="visible" && !typing()) syncNow(); }, 60000);
}
function flushBeacon(){ if(!(S.key && syncOn() && SYNC.ready && SYNC.dirty)) return; clearTimeout(SYNC.t); push(); }
