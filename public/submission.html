<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Здача учасника · МК SMM 1.0</title>
<style>
:root{--bg:#f5f7f5;--card:#fff;--line:#dce5e0;--text:#0a1f17;--muted:#5c6c64;--em:#0f8a5f;--deep:#062a1f;--new:#fff4d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 16px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}h1,h2,h3{margin:0 0 8px}.muted{color:var(--muted)}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px}textarea{min-height:150px;resize:vertical}button,.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:var(--deep);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.btn.alt,button.alt{background:#fff;color:var(--text);border:1px solid var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ok{color:var(--em)}.err{color:#b33}.ans{padding:12px 0;border-bottom:1px solid var(--line)}.ans:last-child{border-bottom:0}.ans b{display:block}.ans code{font-size:11px;color:var(--muted)}.ans div{white-space:pre-wrap;margin-top:5px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef5f1;font-size:12px}.badge.new{background:var(--new)}[hidden]{display:none!important}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="row" style="justify-content:space-between"><div><h1>Здача учасника</h1><p class="muted">Відповіді на момент завершення кроку + можливість одразу дати фідбек у Telegram.</p></div><a class="btn alt" href="admin.html">← Архів</a></div>
<div id="login" class="card"><h2>Вхід адміністратора</h2><input id="email" type="email" placeholder="Email"><div class="row" style="margin-top:10px"><button id="send">Отримати код</button></div><div id="codeBox" hidden><input id="code" inputmode="numeric" placeholder="Код" style="margin-top:10px"><button id="verify" style="margin-top:10px">Увійти</button></div><p id="loginStatus" class="muted"></p></div>
<div id="app" hidden>
  <div class="card"><div class="row" style="justify-content:space-between"><div><h2 id="who">Учасник</h2><div class="muted" id="meta"></div></div><span id="statusBadge" class="badge"></span></div><div class="row" id="contact" style="margin-top:12px"></div></div>
  <div class="card"><h3>Відповіді на момент здачі</h3><p class="muted">Це знімок прогресу саме в момент, коли учасник завершив цей крок.</p><div id="answers"></div></div>
  <div class="card"><h3>Дати особистий фідбек</h3><textarea id="reply" maxlength="3500" placeholder="Напиши короткий фідбек. Він прийде учаснику в Telegram від бота."></textarea><div class="row" style="margin-top:10px"><button id="sendReply">Надіслати в Telegram</button><button class="alt" id="seen">Позначити переглянутим</button></div><p id="actionStatus" class="muted"></p><div id="history"></div></div>
</div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script>
(function(){
var cfg=window.MK_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=function(i){return document.getElementById(i)},mail='',sid=(new URLSearchParams(location.search).get('id')||'').trim(),sub=null,profile=null;
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function fmt(x){try{return new Date(x).toLocaleString('uk-UA')}catch(e){return x||'—'}}
function dayLabel(n){return Number(n)===0?'Старт':'День '+n}
function niceKey(k){
 var m=k.match(/^story_[A-Z]_(\d+)$/); if(m)return 'Відповідь / рефлексія · крок '+m[1];
 m=k.match(/^mc_done_[A-Z]_(\d+)$/); if(m)return 'Завдання виконано · крок '+m[1];
 m=k.match(/^mc_[A-Z]_(\d+)_(.+)$/); if(m){var s=m[2].replace(/^sort(\d+)$/,function(_,n){return 'сортування '+(Number(n)+1)}).replace('decision','рішення').replace(/_/g,' ');return 'Крок '+m[1]+' · '+s;}
 return k.replace(/_/g,' ');
}
async function isAdmin(){var r=await sb.from('admin_users').select('user_id').maybeSingle();return !r.error&&!!r.data}
async function boot(){var s=(await sb.auth.getSession()).data.session;if(!s||!(await isAdmin())){$('login').hidden=false;$('app').hidden=true;return}$('login').hidden=true;$('app').hidden=false;load()}
async function load(){if(!sid){$('actionStatus').className='err';$('actionStatus').textContent='Немає ID здачі.';return}var r=await sb.from('day_submissions').select('*').eq('id',sid).maybeSingle();if(r.error||!r.data){$('actionStatus').className='err';$('actionStatus').textContent='Здачу не знайдено.';return}sub=r.data;var rs=await Promise.all([sb.from('participant_profiles').select('*').eq('user_id',sub.user_id).maybeSingle(),sb.from('day_submission_replies').select('*').eq('submission_id',sid).order('created_at',{ascending:false})]);profile=rs[0].data||{};var replies=rs[1].data||[];
 $('who').textContent=(profile.email||'Учасник')+' · '+dayLabel(sub.day_index);$('meta').textContent='Здано: '+fmt(sub.submitted_at)+' · Telegram: '+(profile.telegram_id||'—')+' · прогрес '+Number(profile.completed_steps||0)+'/6';$('statusBadge').textContent=sub.status;$('statusBadge').className='badge '+(sub.status==='new'?'new':'');
 $('contact').innerHTML=profile.telegram_id?'<a class="btn alt" href="tg://user?id='+encodeURIComponent(profile.telegram_id)+'">Відкрити особистий Telegram</a>':'';
 var f=(sub.snapshot&&sub.snapshot.f)||{},keys=Object.keys(f).sort();$('answers').innerHTML=keys.length?keys.map(function(k){return'<div class="ans"><b>'+esc(niceKey(k))+'</b><code>'+esc(k)+'</code><div>'+esc(f[k])+'</div></div>'}).join(''):'<p class="muted">У цій здачі текстових відповідей ще немає.</p>';
 $('history').innerHTML=replies.length?'<h3 style="margin-top:18px">Вже надісланий фідбек</h3>'+replies.map(function(x){return'<div class="ans"><div>'+esc(x.message)+'</div><small class="muted">'+fmt(x.created_at)+'</small></div>'}).join(''):'';
}
$('send').onclick=async function(){mail=$('email').value.trim().toLowerCase();$('loginStatus').textContent='Надсилаю код…';var r=await sb.auth.signInWithOtp({email:mail,options:{shouldCreateUser:false}});if(r.error){$('loginStatus').className='err';$('loginStatus').textContent=r.error.message;return}$('codeBox').hidden=false;$('loginStatus').className='ok';$('loginStatus').textContent='Код надіслано'};
$('verify').onclick=async function(){var r=await sb.auth.verifyOtp({email:mail,token:$('code').value.trim(),type:'email'});if(r.error){$('loginStatus').className='err';$('loginStatus').textContent='Неправильний або прострочений код';return}boot()};
$('seen').onclick=async function(){if(!sub)return;var r=await sb.from('day_submissions').update({status:'seen',updated_at:new Date().toISOString()}).eq('id',sid);if(r.error){$('actionStatus').className='err';$('actionStatus').textContent='Не вдалося оновити статус';return}$('actionStatus').className='ok';$('actionStatus').textContent='Позначено переглянутим';load()};
$('sendReply').onclick=async function(){var m=$('reply').value.trim();if(!m)return;$('sendReply').disabled=true;$('actionStatus').className='muted';$('actionStatus').textContent='Надсилаю…';var r=await sb.rpc('admin_reply_day_submission',{p_submission_id:sid,p_message:m});$('sendReply').disabled=false;if(r.error){$('actionStatus').className='err';$('actionStatus').textContent='Не вдалося надіслати: '+r.error.message;return}$('actionStatus').className='ok';$('actionStatus').textContent='Фідбек відправлено в Telegram ✓';$('reply').value='';load()};
boot();
})();
</script></body></html>
