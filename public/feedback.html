<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Фідбек учаснику · МК SMM 1.0</title><style>:root{--bg:#f5f7f5;--card:#fff;--line:#dce5e0;--text:#0a1f17;--muted:#5c6c64;--em:#0f8a5f;--deep:#062a1f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}h1,h2,h3{margin:0 0 8px}.muted{color:var(--muted)}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px}textarea{min-height:150px;resize:vertical}button{border:0;border-radius:999px;background:var(--deep);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.ok{color:var(--em)}.err{color:#b33}.ans{padding:10px 0;border-bottom:1px solid var(--line)}.ans code{font-size:12px;color:var(--muted)}.ans div{white-space:pre-wrap;margin-top:4px}[hidden]{display:none!important}</style></head><body><div class="wrap"><h1>Особистий фідбек</h1><p class="muted">Перегляд запиту, відповідей і відправка відповіді учаснику прямо в Telegram-бот.</p><div id="login" class="card"><h2>Вхід адміністратора</h2><input id="email" type="email" placeholder="Email"><div class="row" style="margin-top:10px"><button id="send">Отримати код</button></div><div id="codeBox" hidden><input id="code" inputmode="numeric" placeholder="Код" style="margin-top:10px"><button id="verify" style="margin-top:10px">Увійти</button></div><p id="loginStatus" class="muted"></p></div><div id="app" hidden><div class="card"><h2 id="who">Учасник</h2><div class="muted" id="meta"></div><p><b>Запит:</b></p><p id="question"></p></div><div class="card"><h3>Відповіді симулятора</h3><div id="answers"></div></div><div class="card"><h3>Твоя відповідь</h3><textarea id="reply" maxlength="3500" placeholder="Напиши фідбек. Він прийде користувачу в Telegram від бота."></textarea><div class="row" style="margin-top:10px"><button id="sendReply">Надіслати в Telegram</button><a href="admin.html">Архів учасників</a></div><p id="status" class="muted"></p></div></div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>(function(){var cfg=window.MK_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=function(i){return document.getElementById(i)},mail='',fid=(new URLSearchParams(location.search).get('id')||'').trim(),fb=null;function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}async function isAdmin(){var r=await sb.from('admin_users').select('user_id').maybeSingle();return !r.error&&!!r.data}async function boot(){var s=(await sb.auth.getSession()).data.session;if(!s||!(await isAdmin())){$('login').hidden=false;$('app').hidden=true;return}$('login').hidden=true;$('app').hidden=false;load()}async function load(){if(!fid){$('status').className='err';$('status').textContent='Немає ID запиту.';return}var r=await sb.from('feedback_entries').select('*').eq('id',fid).maybeSingle();if(r.error||!r.data){$('status').className='err';$('status').textContent='Запит не знайдено.';return}fb=r.data;var rs=await Promise.all([sb.from('participant_profiles').select('*').eq('user_id',fb.user_id).maybeSingle(),sb.from('simulator_progress').select('data').eq('user_id',fb.user_id).maybeSingle()]);var p=rs[0].data||{},d=rs[1].data&&rs[1].data.data||{};$('who').textContent=p.email||'Учасник';$('meta').textContent='Telegram ID: '+(p.telegram_id||'—')+' · Прогрес: '+Number(p.completed_steps||0)+'/6 · Етап: '+(p.current_view||'—');$('question').textContent=fb.message||'—';var f=d.f||{},keys=Object.keys(f).sort();$('answers').innerHTML=keys.length?keys.map(function(k){return'<div class="ans"><code>'+esc(k)+'</code><div>'+esc(f[k])+'</div></div>'}).join(''):'<p class="muted">Відповідей ще немає.</p>';if(fb.status==='answered'){$('status').className='ok';$('status').textContent='На цей запит уже надано фідбек.'}}$('send').onclick=async function(){mail=$('email').value.trim().toLowerCase();$('loginStatus').textContent='Надсилаю код…';var r=await sb.auth.signInWithOtp({email:mail,options:{shouldCreateUser:false}});if(r.error){$('loginStatus').className='err';$('loginStatus').textContent=r.error.message;return}$('codeBox').hidden=false;$('loginStatus').className='ok';$('loginStatus').textContent='Код надіслано'};$('verify').onclick=async function(){var r=await sb.auth.verifyOtp({email:mail,token:$('code').value.trim(),type:'email'});if(r.error){$('loginStatus').className='err';$('loginStatus').textContent='Неправильний або прострочений код';return}boot()};$('sendReply').onclick=async function(){var m=$('reply').value.trim();if(!m){$('status').className='err';$('status').textContent='Напиши відповідь.';return}$('sendReply').disabled=true;$('status').className='muted';$('status').textContent='Надсилаю в Telegram…';var r=await sb.rpc('admin_reply_feedback',{p_feedback_id:fid,p_message:m});$('sendReply').disabled=false;if(r.error){$('status').className='err';$('status').textContent='Не вдалося надіслати: '+r.error.message;return}$('status').className='ok';$('status').textContent='Відправлено в Telegram ✓';$('reply').value=''};boot()})();</script></body></html>
