<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Архів учасників · МК SMM 1.0</title><style>
:root{--bg:#f5f7f5;--card:#fff;--line:#dce5e0;--text:#0a1f17;--muted:#5c6c64;--em:#0f8a5f;--deep:#062a1f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.k b{display:block;font-size:28px}.k span{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{font:inherit;border-radius:12px;padding:11px 13px}input{border:1px solid var(--line);background:#fff;min-width:260px}button{border:0;background:var(--deep);color:#fff;font-weight:700;cursor:pointer}button.alt{background:#fff;color:var(--text);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);position:sticky;top:0;background:#fff}.table{overflow:auto;max-height:65vh}.muted{color:var(--muted)}.err{color:#b33}.ok{color:var(--em)}[hidden]{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">МК SMM 1.0 · архів учасників</div><div class="muted">Доступ лише для адміністратора</div></div><div class="row"><button id="refresh" hidden>Оновити</button><button class="alt" id="export" hidden>CSV</button><button class="alt" id="logout" hidden>Вийти</button></div></div>
<div class="card" id="login"><h2>Вхід адміністратора</h2><p class="muted">Введи email адміністратора. Прийде одноразовий код.</p><div class="row"><input id="email" type="email" placeholder="email"><button id="send">Отримати код</button></div><div class="row" id="codeRow" hidden style="margin-top:10px"><input id="code" inputmode="numeric" placeholder="Код"><button id="verify">Увійти</button></div><p id="status" class="muted"></p></div>
<div id="dash" hidden><div class="grid" id="stats"></div><div class="card"><div class="row"><input id="search" placeholder="Пошук: email / Telegram / contact ID"><select id="filter" style="padding:11px 13px;border:1px solid var(--line);border-radius:12px"><option value="all">Усі</option><option value="not_started">Не почали</option><option value="active">У процесі</option><option value="stale24">Неактивні 24+ год</option><option value="completed">Завершили</option></select></div></div><div class="card table"><table><thead><tr><th>Email</th><th>Telegram</th><th>SendPulse contact</th><th>Джерело</th><th>Прогрес</th><th>Екран</th><th>Перша поява</th><th>Остання активність</th><th>Старт</th><th>Фініш</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
(function(){var cfg=window.MK_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),rows=[];var $=function(id){return document.getElementById(id)};function fmt(x){if(!x)return'—';try{return new Date(x).toLocaleString('uk-UA')}catch(e){return x}}function ageH(x){return x?(Date.now()-new Date(x).getTime())/36e5:99999}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function showAuth(on){$('login').hidden=on;$('dash').hidden=!on;$('refresh').hidden=!on;$('export').hidden=!on;$('logout').hidden=!on}
async function isAdmin(){var r=await sb.from('admin_users').select('user_id').maybeSingle();return !r.error&&!!r.data}async function boot(){var s=(await sb.auth.getSession()).data.session;if(!s){showAuth(false);return}if(!(await isAdmin())){await sb.auth.signOut();$('status').className='err';$('status').textContent='Цей акаунт не має доступу до архіву.';showAuth(false);return}showAuth(true);load()}
async function load(){var r=await sb.from('participant_profiles').select('*').order('last_activity_at',{ascending:false,nullsFirst:false});if(r.error){alert('Не вдалося завантажити архів: '+r.error.message);return}rows=r.data||[];render()}
function filtered(){var q=$('search').value.trim().toLowerCase(),f=$('filter').value;return rows.filter(function(r){var hay=[r.email,r.telegram_id,r.sendpulse_contact_id,r.source].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(f==='not_started')return !r.started_at;if(f==='active')return !!r.started_at&&!r.completed_at&&ageH(r.last_activity_at)<24;if(f==='stale24')return !r.completed_at&&ageH(r.last_activity_at)>=24;if(f==='completed')return !!r.completed_at;return true})}
function render(){var all=rows,done=all.filter(function(r){return r.completed_at}).length,started=all.filter(function(r){return r.started_at}).length,stale=all.filter(function(r){return !r.completed_at&&ageH(r.last_activity_at)>=24}).length;$('stats').innerHTML='<div class="k"><b>'+all.length+'</b><span>учасників</span></div><div class="k"><b>'+started+'</b><span>почали</span></div><div class="k"><b>'+done+'</b><span>завершили</span></div><div class="k"><b>'+stale+'</b><span>неактивні 24+ год</span></div>';var data=filtered();$('tbody').innerHTML=data.map(function(r){return'<tr><td>'+esc(r.email||'—')+'</td><td>'+esc(r.telegram_id||'—')+'</td><td>'+esc(r.sendpulse_contact_id||'—')+'</td><td>'+esc(r.source||'—')+'</td><td><b>'+Number(r.progress_percent||0)+'%</b><br><span class="muted">'+Number(r.completed_steps||0)+'/6</span></td><td>'+esc(r.current_view||'—')+'</td><td>'+fmt(r.first_seen_at)+'</td><td>'+fmt(r.last_activity_at||r.last_seen_at)+'</td><td>'+fmt(r.started_at)+'</td><td>'+fmt(r.completed_at)+'</td></tr>'}).join('')||'<tr><td colspan="10" class="muted">Немає даних</td></tr>'}
$('send').onclick=async function(){var email=$('email').value.trim().toLowerCase();$('status').textContent='Надсилаю код…';var r=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:false}});if(r.error){$('status').className='err';$('status').textContent=r.error.message;return}$('status').className='ok';$('status').textContent='Код надіслано';$('codeRow').hidden=false;window.__adminEmail=email};$('verify').onclick=async function(){var r=await sb.auth.verifyOtp({email:window.__adminEmail,token:$('code').value.trim(),type:'email'});if(r.error){$('status').className='err';$('status').textContent='Неправильний або прострочений код';return}boot()};$('refresh').onclick=load;$('logout').onclick=async function(){await sb.auth.signOut();location.reload()};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=function(){var data=filtered(),cols=['email','telegram_id','sendpulse_contact_id','source','progress_percent','completed_steps','current_view','first_seen_at','last_activity_at','started_at','completed_at'],csv=[cols.join(',')].concat(data.map(function(r){return cols.map(function(k){return'"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"'}).join(',')})).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mk-smm-participants.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};boot()})();
</script></body></html>
