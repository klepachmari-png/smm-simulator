<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Архів учасників · МК SMM 1.0</title><style>
:root{--bg:#f5f7f5;--card:#fff;--line:#dce5e0;--text:#0a1f17;--muted:#5c6c64;--em:#0f8a5f;--deep:#062a1f;--warn:#9a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.k{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.k b{display:block;font-size:28px}.k span{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border-radius:12px;padding:11px 13px}input,select{border:1px solid var(--line);background:#fff}input{min-width:260px}button{border:0;background:var(--deep);color:#fff;font-weight:700;cursor:pointer}button.alt{background:#fff;color:var(--text);border:1px solid var(--line)}button.sm{padding:7px 10px;font-size:12px}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;min-width:1040px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);position:sticky;top:0;background:#fff}.table{overflow:auto;max-height:67vh}.muted{color:var(--muted)}.err{color:#b33}.ok{color:var(--em)}[hidden]{display:none!important}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef5f1;font-size:12px}.badge.new{background:#fff4d8;color:#815000}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px;z-index:100}.box{width:min(100%,900px);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:20px}.boxhead{display:flex;justify-content:space-between;align-items:start;gap:16px}.boxhead h2{margin:0}.x{background:transparent;color:var(--text);font-size:24px;padding:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ans{padding:12px 0;border-bottom:1px solid var(--line)}.ans code{font-size:12px;color:var(--muted)}.ans div{white-space:pre-wrap;margin-top:4px}.fb{padding:14px;border:1px solid var(--line);border-radius:14px;margin:10px 0}.fb h4{margin:0 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:14px}.cols{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">МК SMM 1.0 · архів учасників</div><div class="muted">Прогрес, відповіді, опитування та запити на фідбек</div></div><div class="row"><button id="refresh" hidden>Оновити</button><button class="alt" id="export" hidden>CSV</button><button class="alt" id="logout" hidden>Вийти</button></div></div>
<div class="card" id="login"><h2>Вхід адміністратора</h2><p class="muted">Введи email адміністратора. Прийде одноразовий код.</p><div class="row"><input id="email" type="email" placeholder="email"><button id="send">Отримати код</button></div><div class="row" id="codeRow" hidden style="margin-top:10px"><input id="code" inputmode="numeric" placeholder="Код"><button id="verify">Увійти</button></div><p id="status" class="muted"></p></div>
<div id="dash" hidden><div class="grid" id="stats"></div><div class="card"><div class="row"><input id="search" placeholder="Пошук: email / Telegram / contact ID"><select id="filter"><option value="all">Усі</option><option value="not_started">Не почали</option><option value="active">У процесі</option><option value="stale36">Неактивні 36+ год</option><option value="feedback">Є новий фідбек</option><option value="completed">Завершили</option></select></div></div><div class="card table"><table><thead><tr><th>Email</th><th>Telegram</th><th>Прогрес</th><th>Екран</th><th>Остання активність</th><th>Фідбек</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>
<div id="modal" class="modal" hidden><div class="box"><div class="boxhead"><div><h2 id="mtitle">Учасник</h2><div class="muted" id="msub"></div></div><button class="x" id="mclose">×</button></div><div id="mdetail"></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
(function(){var cfg=window.MK_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),profiles=[],progress={},feedback={};var $=function(id){return document.getElementById(id)};function fmt(x){if(!x)return'—';try{return new Date(x).toLocaleString('uk-UA')}catch(e){return x}}function ageH(x){return x?(Date.now()-new Date(x).getTime())/36e5:99999}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function showAuth(on){$('login').hidden=on;$('dash').hidden=!on;$('refresh').hidden=!on;$('export').hidden=!on;$('logout').hidden=!on}function fbs(uid){return feedback[uid]||[]}function newFb(uid){return fbs(uid).filter(function(x){return x.status==='new'}).length}
async function isAdmin(){var r=await sb.from('admin_users').select('user_id').maybeSingle();return !r.error&&!!r.data}async function boot(){var s=(await sb.auth.getSession()).data.session;if(!s){showAuth(false);return}if(!(await isAdmin())){await sb.auth.signOut();$('status').className='err';$('status').textContent='Цей акаунт не має доступу до архіву.';showAuth(false);return}showAuth(true);load()}
async function load(){var rs=await Promise.all([sb.from('participant_profiles').select('*').order('last_activity_at',{ascending:false,nullsFirst:false}),sb.from('simulator_progress').select('user_id,data,updated_at'),sb.from('feedback_entries').select('*').order('created_at',{ascending:false})]);if(rs.some(function(x){return x.error})){alert('Не вдалося завантажити архів.');return}profiles=rs[0].data||[];progress={};(rs[1].data||[]).forEach(function(x){progress[x.user_id]=x});feedback={};(rs[2].data||[]).forEach(function(x){(feedback[x.user_id]||(feedback[x.user_id]=[])).push(x)});render()}
function filtered(){var q=$('search').value.trim().toLowerCase(),f=$('filter').value;return profiles.filter(function(r){var hay=[r.email,r.telegram_id,r.sendpulse_contact_id,r.source].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(f==='not_started')return !r.started_at;if(f==='active')return !!r.started_at&&!r.completed_at&&ageH(r.last_activity_at)<36;if(f==='stale36')return !r.completed_at&&ageH(r.last_activity_at)>=36;if(f==='feedback')return newFb(r.user_id)>0;if(f==='completed')return !!r.completed_at;return true})}
function render(){var all=profiles,done=all.filter(function(r){return r.completed_at}).length,started=all.filter(function(r){return r.started_at}).length,stale=all.filter(function(r){return !r.completed_at&&ageH(r.last_activity_at)>=36}).length,nfb=all.reduce(function(a,r){return a+newFb(r.user_id)},0);$('stats').innerHTML='<div class="k"><b>'+all.length+'</b><span>учасників</span></div><div class="k"><b>'+started+'</b><span>почали</span></div><div class="k"><b>'+done+'</b><span>завершили</span></div><div class="k"><b>'+stale+'</b><span>неактивні 36+ год</span></div><div class="k"><b>'+nfb+'</b><span>нові запити / відгуки</span></div>';var data=filtered();$('tbody').innerHTML=data.map(function(r){var nf=newFb(r.user_id),h=ageH(r.last_activity_at);return'<tr><td>'+esc(r.email||'—')+'</td><td>'+esc(r.telegram_id||'—')+'</td><td><b>'+Number(r.progress_percent||0)+'%</b><br><span class="muted">'+Number(r.completed_steps||0)+'/6</span></td><td>'+esc(r.current_view||'—')+'</td><td class="'+(h>=36&&!r.completed_at?'warn':'')+'">'+fmt(r.last_activity_at||r.last_seen_at)+'</td><td>'+(nf?'<span class="badge new">'+nf+' нов.</span>':(fbs(r.user_id).length?'<span class="badge">'+fbs(r.user_id).length+'</span>':'—'))+'</td><td><button class="sm" data-open="'+esc(r.user_id)+'">Відкрити</button></td></tr>'}).join('')||'<tr><td colspan="7" class="muted">Немає даних</td></tr>';$('tbody').querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openUser(b.dataset.open)}})}
function answerList(d){var f=(d&&d.f)||{},keys=Object.keys(f).sort();if(!keys.length)return'<p class="muted">Відповідей ще немає.</p>';return keys.map(function(k){return'<div class="ans"><code>'+esc(k)+'</code><div>'+esc(f[k])+'</div></div>'}).join('')}
function feedbackList(uid){var arr=fbs(uid);if(!arr.length)return'<p class="muted">Опитувань і запитів ще немає.</p>';return arr.map(function(x){var title=x.kind==='personal_feedback'?'Запит на особистий фідбек':'Опитування';return'<div class="fb"><h4>'+title+' <span class="badge '+(x.status==='new'?'new':'')+'">'+esc(x.status)+'</span></h4><div class="muted">'+fmt(x.created_at)+' · '+esc(x.stage||'')+(x.rating?' · '+x.rating+'/5':'')+'</div>'+(x.likes?'<p><b>Подобається:</b> '+esc(x.likes)+'</p>':'')+(x.dislikes?'<p><b>Не подобається / незрозуміло:</b> '+esc(x.dislikes)+'</p>':'')+(x.message?'<p><b>Повідомлення:</b> '+esc(x.message)+'</p>':'')+'<div class="actions">'+(x.status==='new'?'<button class="sm" data-seen="'+x.id+'">Позначити переглянутим</button>':'')+(x.kind==='personal_feedback'&&x.status!=='answered'?'<button class="sm alt" data-answered="'+x.id+'">Фідбек надано</button>':'')+'</div></div>'}).join('')}
function openUser(uid){var p=profiles.find(function(x){return x.user_id===uid}),pr=progress[uid],d=pr&&pr.data||{};$('mtitle').textContent=p&&p.email||'Учасник';$('msub').textContent='Telegram: '+(p&&p.telegram_id||'—')+' · SendPulse: '+(p&&p.sendpulse_contact_id||'—');var tg=p&&p.telegram_id?'<a href="tg://user?id='+encodeURIComponent(p.telegram_id)+'">Відкрити Telegram-профіль</a>':'Telegram ID не збережений';$('mdetail').innerHTML='<div class="card"><div class="cols"><div><b>Етап</b><p>'+esc(p&&p.current_view||d.view||'—')+' · '+Number(p&&p.completed_steps||0)+'/6</p></div><div><b>Остання активність</b><p>'+fmt(p&&p.last_activity_at)+'</p></div><div><b>Джерело</b><p>'+esc(p&&p.source||'—')+'</p></div><div><b>Контакт</b><p>'+tg+'</p></div></div></div><div class="cols"><div class="card"><h3>Відповіді симулятора</h3>'+answerList(d)+'</div><div class="card"><h3>Опитування та фідбек</h3>'+feedbackList(uid)+'</div></div>';$('modal').hidden=false;$('mdetail').querySelectorAll('[data-seen]').forEach(function(b){b.onclick=function(){setFb(b.dataset.seen,'seen',uid)}});$('mdetail').querySelectorAll('[data-answered]').forEach(function(b){b.onclick=function(){setFb(b.dataset.answered,'answered',uid)}})}
async function setFb(id,status,uid){var r=await sb.from('feedback_entries').update({status:status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert('Не вдалося оновити статус');return}await load();openUser(uid)}
$('mclose').onclick=function(){$('modal').hidden=true};$('modal').onclick=function(e){if(e.target===$('modal'))$('modal').hidden=true};$('send').onclick=async function(){var email=$('email').value.trim().toLowerCase();$('status').textContent='Надсилаю код…';var r=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:false}});if(r.error){$('status').className='err';$('status').textContent=r.error.message;return}$('status').className='ok';$('status').textContent='Код надіслано';$('codeRow').hidden=false;window.__adminEmail=email};$('verify').onclick=async function(){var r=await sb.auth.verifyOtp({email:window.__adminEmail,token:$('code').value.trim(),type:'email'});if(r.error){$('status').className='err';$('status').textContent='Неправильний або прострочений код';return}boot()};$('refresh').onclick=load;$('logout').onclick=async function(){await sb.auth.signOut();location.reload()};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=function(){var data=filtered(),cols=['email','telegram_id','sendpulse_contact_id','source','progress_percent','completed_steps','current_view','first_seen_at','last_activity_at','started_at','completed_at'],csv=[cols.join(',')].concat(data.map(function(r){return cols.map(function(k){return'"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"'}).join(',')})).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mk-smm-participants.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};boot()})();
</script></body></html>
