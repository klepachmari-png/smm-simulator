name: Deploy MK SMM to GitHub Pages

on:
  push:
    branches:
      - main
      - rebuild-email-login
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare cache-safe build
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          sha = os.environ.get('GITHUB_SHA','dev')[:12]
          old = 'https://smm-ai-mariia-klepach.klepachmari.chatgpt.site/'
          new = 'https://klepachmari-png.github.io/smm-simulator/'
          for name in ('public/index.html','public/simulator.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace(old, new)
              if name.endswith('simulator.html'):
                  s = re.sub(r'src="cloud\.js(?:\?v=[^"]*)?"', f'src="cloud.js?v={sha}"', s)
              p.write_text(s, encoding='utf-8')
          p = Path('public/cloud.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"s\.src='engagement\.js(?:\?v=[^']*)?'", f"s.src='engagement.js?v={sha}'", s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
