name: Deploy MK SMM to GitHub Pages

on:
  push:
    branches:
      - main
      - rebuild-email-login
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare cache-safe build
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          sha = os.environ.get('GITHUB_SHA','dev')[:12]
          old = 'https://smm-ai-mariia-klepach.klepachmari.chatgpt.site/'
          new = 'https://klepachmari-png.github.io/smm-simulator/'
          for name in ('public/index.html','public/simulator.html','public/admin.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace(old, new)
              if name.endswith('index.html'):
                  s = s.replace('a.href = "login.html?next=simulator.html";', 'a.href = "https://t.me/smm_ai_mariia_klepach_bot?start=sim_landing";')
              if name.endswith('simulator.html'):
                  s = re.sub(r'src="cloud\.js(?:\?v=[^"]*)?"', f'src="cloud.js?v={sha}"', s)
                  if 'state-integrity.js' not in s:
                      s = re.sub(r'(<script src="cloud\.js\?v=[^"]+"></script>)', r'\1\n<script src="state-integrity.js?v='+sha+r'"></script>', s, count=1)
                  else:
                      s = re.sub(r'src="state-integrity\.js(?:\?v=[^"]*)?"', f'src="state-integrity.js?v={sha}"', s)
                  s = re.sub(r'src="sync-fix\.js(?:\?v=[^"]*)?"', f'src="sync-fix.js?v={sha}"', s)
                  s = re.sub(r'src="auth-ui\.js(?:\?v=[^"]*)?"', f'src="auth-ui.js?v={sha}"', s)
                  s = re.sub(r'\s*<script src="sync-safety-v2\.js(?:\?v=[^"]*)?"></script>', '', s)
                  if 'sync-fix.js' not in s:
                      s = s.replace('</body>', f'<script src="sync-fix.js?v={sha}"></script>\n</body>')
                  if 'auth-ui.js' not in s:
                      s = s.replace('</body>', f'<script src="auth-ui.js?v={sha}"></script>\n</body>')
                  if 'route-b-business-fix.js' not in s:
                      s = s.replace('</body>', f'<script src="route-b-business-fix.js?v={sha}"></script>\n</body>')
                  if 'route-b-education.js' not in s:
                      s = s.replace('</body>', f'<script src="route-b-education.js?v={sha}"></script>\n</body>')
                  if 'final-funnel-fix.js' not in s:
                      s = s.replace('</body>', f'<script src="final-funnel-fix.js?v={sha}"></script>\n</body>')
                  if 'route-state-guard.js' not in s:
                      s = s.replace('</body>', f'<script src="route-state-guard.js?v={sha}"></script>\n</body>')
                  if 'challenge-workflow-v2.js' not in s:
                      s = re.sub(r'(<script src="story-course\.js(?:\?v=[^"]*)?"></script>)', r'\1\n<script src="challenge-workflow-v2.js?v='+sha+r'"></script>', s, count=1)
                  else:
                      s = re.sub(r'src="challenge-workflow-v2\.js(?:\?v=[^"]*)?"', f'src="challenge-workflow-v2.js?v={sha}"', s)

                  # Remove obsolete AI workflow versions. Their capture listeners could intercept clicks
                  # before the newest workflow and copy an older prompt.
                  s = re.sub(r'\s*<script src="ai-workflow-v[234]\.js(?:\?v=[^"]*)?"></script>', '', s)
                  if 'ai-workflow-v5.js' not in s:
                      s = re.sub(r'(<script src="challenge-workflow-v2\.js(?:\?v=[^"]*)?"></script>)', r'\1\n<script src="ai-workflow-v5.js?v='+sha+r'"></script>', s, count=1)
                  else:
                      s = re.sub(r'src="ai-workflow-v5\.js(?:\?v=[^"]*)?"', f'src="ai-workflow-v5.js?v={sha}"', s)
              if name.endswith('admin.html') and 'submissions.html' not in s:
                  s = s.replace('<div class="row"><button id="refresh" hidden>', '<div class="row"><button class="alt" type="button" onclick="location.href=\'submissions.html\'">Здачі</button><button id="refresh" hidden>')
              p.write_text(s, encoding='utf-8')
          p = Path('public/cloud.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"s\.src='engagement\.js(?:\?v=[^']*)?'", f"s.src='engagement.js?v={sha}'", s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
